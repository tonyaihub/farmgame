<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnotHeR F*CkF*Rm GAMe | Профиль</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary-green: #4CAF50;
            --accent-neon: #8BC34A;
            --neon-glow-white: #fff;
            --neon-glow-green: #4CAF50;
            --dark-bg: #050505; /* Еще темнее */
            --card-bg: #111;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace; /* Более "технический" шрифт для фона */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- НОВЫЙ ЛОГОТИП: ЦИФРОВОЙ ТРАФАРЕТ --- */
        .header-logo {
            margin-top: 50px;
            margin-bottom: 20px;
            text-align: center;
            width: 90%;
            max-width: 700px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(76, 175, 80, 0.1);
        }

        .logo-word {
            display: block;
            font-family: 'Trebuchet MS', sans-serif; /* Временный армейский стиль */
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -1px;
            
            /* Эффект трафарета (через clip-path или mask, но сделаем проще через шрифт) */
            /* Для настоящего трафарета нужен спец. шрифт, имитируем через цвет */
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.6);
            
            position: relative;
        }

        /* Восстанавливаем рваный регистр через ::before */
        .w1::before { content: "AnotHeR"; }
        .w2::before { content: "F*CkF*Rm"; }
        .w3::before { content: "GAMe"; }

        .w1::before, .w2::before, .w3::before {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            -webkit-text-fill-color: var(--neon-glow-white);
            -webkit-text-stroke: 0;
        }

        /* Размеры строк */
        .w1 { font-size: 3.8rem; letter-spacing: 2px;}
        .w2 { font-size: 5.5rem; letter-spacing: -2px; margin-top: -5px;}
        .w3 { font-size: 4.5rem; letter-spacing: 5px; margin-top: -5px;}

        /* НЕОНОВОЕ СВЕЧЕНИЕ (Digital Glow) */
        .w1::before {
            color: var(--neon-glow-white);
            text-shadow: 
                0 0 5px var(--neon-glow-white),
                0 0 10px var(--neon-glow-white),
                0 0 20px var(--neon-glow-green),
                0 0 40px var(--neon-glow-green),
                0 0 60px var(--neon-glow-green);
        }

        .w2::before {
            color: var(--accent-neon);
            text-shadow: 
                0 0 5px var(--neon-glow-white),
                0 0 10px var(--accent-neon),
                0 0 20px var(--neon-glow-green),
                0 0 30px var(--neon-glow-green),
                0 0 50px var(--neon-glow-green),
                0 0 80px var(--neon-glow-green);
        }

        .w3::before {
            color: var(--neon-glow-white);
            text-shadow: 
                0 0 5px var(--neon-glow-white),
                0 0 10px var(--neon-glow-white),
                0 0 20px var(--neon-glow-green),
                0 0 40px var(--neon-glow-green);
        }


        /* --- Анимация (Трактор и Квадрокоптер без отзеркаливания) --- */
        .animation-container {
            width: 100%;
            height: 180px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
            background: linear-gradient(to bottom, transparent, rgba(76, 175, 80, 0.08) 70%, transparent);
            border-bottom: 2px solid rgba(76, 175, 80, 0.2);
        }

        .tractor {
            font-size: 7rem;
            position: absolute;
            bottom: -15px;
            left: -200px;
            transform: none; /* Убрано отзеркаливание */
            animation: driveRight 14s linear infinite;
            z-index: 2;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .quadcopter {
            font-size: 3.5rem;
            position: absolute;
            bottom: 110px;
            left: -300px;
            transform: none; /* Убрано отзеркаливание */
            animation: flyRight 14s linear infinite;
            z-index: 1;
            filter: drop-shadow(0 0 15px var(--accent-neon));
        }

        @keyframes driveRight {
            0% { left: -200px; }
            80% { left: calc(100% + 100px); opacity: 1; }
            81% { left: calc(100% + 100px); opacity: 0; }
            82% { left: -200px; opacity: 0; }
            100% { left: -200px; opacity: 1; }
        }

        @keyframes flyRight {
            0% { left: -300px; transform: translateY(0px); }
            25% { transform: translateY(-30px) rotate(5deg); }
            50% { transform: translateY(0px) rotate(-5deg); }
            75% { transform: translateY(15px) rotate(0deg); }
            80% { left: calc(100% + 100px); opacity: 1; transform: translateY(0px); }
            81% { left: calc(100% + 100px); opacity: 0; }
            82% { left: -300px; opacity: 0; }
            100% { left: -300px; opacity: 1; transform: translateY(0px); }
        }

        /* --- UI Профиля (Шрифт изменен на Courier New) --- */
        .hidden { display: none; }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 40px;
            margin-bottom: 50px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Возвращаем для UI */
        }

        .btn-login-google {
            background: white;
            color: #757575;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }
        .btn-login-google:hover { background: #eee; transform: translateY(-2px); }

        .profile-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            border: 1px solid rgba(139, 195, 74, 0.15);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--primary-green);
            object-fit: cover;
        }

        .level-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: linear-gradient(135deg, var(--accent-neon), var(--primary-green));
            color: var(--dark-bg);
            font-weight: bold;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .user-coins { color: #FFD700; font-weight: bold; font-size: 1.3rem; margin-top: 5px;}

        label { font-size: 0.8rem; color: #888; display: block; text-align: left; margin-left: 5px; margin-bottom: 2px; }

        input[type="text"] {
            width: calc(100% - 24px);
            background: rgba(255,255,255,0.03);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            font-size: 1rem;
        }
        input[type="text"]:focus { outline: none; border-color: var(--accent-neon); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.1s;
        }
        .btn:active { transform: scale(0.98); }

        .btn-save {
            background: linear-gradient(135deg, var(--primary-green), var(--accent-neon));
            color: var(--dark-bg);
        }

        .btn-logout { background: #2a2a2a; color: #aaa; margin-top: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-logout:hover { background: #333; color: #fff; }
    </style>
</head>
<body>

    <div class="header-logo">
        <span class="logo-word w1"></span> <span class="logo-word w2"></span>
        <span class="logo-word w3"></span>
    </div>

    <div class="animation-container">
        <div class="quadcopter">🚁</div>
        <div class="tractor">🚜</div>
    </div>

    <div class="main-container">
        <div id="authScreen">
            <button class="btn-login-google" onclick="login()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_\" G\"_Logo.svg" width="22" alt="G">
                Привязать Google Аккаунт
            </button>
        </div>

        <div id="profileScreen" class="hidden">
            <div class="profile-card">
                <div class="avatar-container">
                    <img id="userAvatar" class="avatar" src="" alt="Avatar">
                    <div class="level-badge"><span id="userLevel">1</span> LVL</div>
                </div>
                <h2 id="userName" style="margin: 0; color: #fff; font-family: 'Segoe UI', sans-serif;">Агроном</h2>
                <p class="user-coins"><span id="userCoins">100</span> <span style="font-size:1rem; opacity:0.7;">💰</span></p>
                
                <div style="margin-top: 25px;">
                    <label>Никнейм</label>
                    <input type="text" id="editName" placeholder="Твое имя в игре">
                    <label>URL Аватара</label>
                    <input type="text" id="editPhoto" placeholder="https://image.url/photo.jpg">
                </div>

                <button class="btn btn-save" onclick="saveProfile()">Сохранить изменения</button>
                <button class="btn btn-logout" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <script>
        // === КОНФИГ FIREBASE (ЗАМЕНИ НА СВОЙ) ===
        const firebaseConfig = {
            apiKey: "ТВОЙ_API_KEY",
            authDomain: "ТВОЙ_ПРОЕКТ.firebaseapp.com",
            projectId: "ТВОЙ_ПРОЕКТ",
            storageBucket: "ТВОЙ_ПРОЕКТ.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };
        // ===========================================

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => console.error(e));
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('profileScreen').classList.remove('hidden');
                loadUserData(user);
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('profileScreen').classList.add('hidden');
            }
        });

        async function loadUserData(user) {
            try {
                const doc = await db.collection("players").doc(user.uid).get();
                if (doc.exists) {
                    updateUI(doc.data());
                } else {
                    const newUser = {
                        name: user.displayName || "Новый фермер",
                        photo: user.photoURL || "https://via.placeholder.com/150",
                        level: 1,
                        coins: 1000,
                        exp: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection("players").doc(user.uid).set(newUser);
                    updateUI(newUser);
                }
            } catch (e) { console.error("Ошибка загрузки данных:", e); }
        }

        function updateUI(data) {
            document.getElementById('userName').innerText = data.name;
            document.getElementById('userAvatar').src = data.photo;
            document.getElementById('userLevel').innerText = data.level;
            document.getElementById('userCoins').innerText = data.coins.toLocaleString();
            document.getElementById('editName').value = data.name;
            document.getElementById('editPhoto').value = data.photo;
        }

        async function saveProfile() {
            const user = auth.currentUser;
            const newName = document.getElementById('editName').value;
            if(!newName) { alert("Имя не может быть пустым!"); return; }

            const updates = {
                name: newName,
                photo: document.getElementById('editPhoto').value
            };
            try {
                await db.collection("players").doc(user.uid).update(updates);
                alert("Профиль обновлен! 🚜");
                location.reload();
            } catch (e) { console.error("Ошибка обновления:", e); alert("Ошибка сохранения.");}
        }
    </script>
</body>
</html>
