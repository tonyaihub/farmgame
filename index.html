<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnotherF**kFarmGame | Game</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary-green: #4CAF50;
            --accent-neon: #8BC34A;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --gold: #FFD700;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* --- Логотип (Стиль Digital Stencil) --- */
        .header-logo {
            margin-top: 40px;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .logo-text {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(135deg, #fff 10%, var(--accent-neon) 60%, var(--primary-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(76, 175, 80, 0.4);
        }

        /* --- Обновленная Анимация (Дрон ПЕРЕД Трактором) --- */
        .animation-container {
            width: 100%;
            height: 150px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
            background: linear-gradient(to bottom, transparent, rgba(76, 175, 80, 0.05) 70%, transparent);
            border-bottom: 2px solid rgba(76, 175, 80, 0.1);
        }

        .tractor {
            font-size: 6rem;
            position: absolute;
            bottom: -10px;
            left: -150px;
            transform: scaleX(-1); /* Разворот направо */
            animation: driveRight 14s linear infinite;
            z-index: 2;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .drone {
            font-size: 2.8rem;
            position: absolute;
            bottom: 70px;
            left: -50px; /* Стартует впереди трактора */
            transform: scaleX(-1); /* Разворот направо */
            animation: flyRight 14s linear infinite;
            z-index: 1;
            filter: drop-shadow(0 0 15px var(--accent-neon));
        }

        @keyframes driveRight {
            0% { left: -200px; }
            100% { left: 110%; }
        }

        @keyframes flyRight {
            0% { left: -50px; transform: translateY(0px) scaleX(-1); }
            25% { transform: translateY(-15px) scaleX(-1); }
            50% { transform: translateY(0px) scaleX(-1); }
            75% { transform: translateY(15px) scaleX(-1); }
            100% { left: calc(110% + 150px); transform: translateY(0px) scaleX(-1); }
        }

        /* --- Контейнеры и Карточки --- */
        .main-container { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 25px; }
        .hidden { display: none !important; }

        .game-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 400px;
            border: 1px solid rgba(139, 195, 74, 0.15);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary-green); object-fit: cover; margin-bottom: 10px; }
        .user-coins { color: var(--gold); font-weight: bold; font-size: 1.6rem; margin: 10px 0; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

        /* --- Сетка Магазина --- */
        .shop-grid { display: grid; gap: 12px; width: 100%; margin-top: 15px; }
        .shop-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .item-info { text-align: left; }
        .item-name { font-weight: bold; color: var(--accent-neon); display: block; }
        .item-price { color: var(--gold); font-size: 0.9rem; }

        /* --- Кнопки и Инпуты --- */
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-save { background: var(--primary-green); color: white; width: 100%; margin-top: 10px; }
        .btn-buy { background: var(--accent-neon); color: var(--dark-bg); font-size: 0.8rem; }
        
        input[type="text"] {
            width: 100%; background: #222; color: #fff; border: 1px solid #333;
            padding: 10px; margin: 8px 0; border-radius: 8px; box-sizing: border-box;
        }

        /* --- Навигация --- */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; background: #111;
            display: flex; justify-content: space-around; padding: 15px 0;
            border-top: 2px solid var(--primary-green); z-index: 100;
        }
        .nav-item { color: #666; text-decoration: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .nav-item.active { color: var(--accent-neon); }
    </style>
</head>
<body>

    <div class="header-logo">
        <div class="logo-text">AnotherF**kFarmGame</div>
    </div>

    <div class="animation-container">
        <div class="drone">🛸</div>
        <div class="tractor">🚜</div>
    </div>

    <div class="main-container">
        <div id="authScreen">
            <button class="btn" style="background:white; color:#333; padding: 15px 30px;" onclick="login()">
                Войти через Google
            </button>
        </div>

        <div id="profileScreen" class="game-card hidden">
            <img id="userAvatar" class="avatar" src="" alt="Avatar">
            <h2 id="userName" style="margin:5px 0;">Фермер</h2>
            <div class="user-coins"><span id="coinDisplay">0</span> 💰</div>
            <p style="margin: 5px 0; opacity: 0.7;">Уровень: <span id="userLevel">1</span></p>
            
            <div style="text-align: left; margin-top: 15px;">
                <label style="font-size: 0.7rem; color: #777; margin-left: 5px;">НИКНЕЙМ</label>
                <input type="text" id="editName">
                <label style="font-size: 0.7rem; color: #777; margin-left: 5px;">URL АВАТАРА</label>
                <input type="text" id="editPhoto">
            </div>
            <button class="btn btn-save" onclick="saveProfile()">Сохранить изменения</button>
            <button onclick="logout()" style="background:none; border:none; color:#ff4444; margin-top:20px; cursor:pointer; width:100%;">Выйти из аккаунта</button>
        </div>

        <div id="cityScreen" class="game-card hidden">
            <h2 style="margin-top:0;">Городской рынок</h2>
            <div class="user-coins">Баланс: <span id="shopCoinDisplay">0</span> 💰</div>
            
            <div class="shop-grid">
                <div class="shop-item">
                    <div class="item-info">
                        <span class="item-name">📦 Био-удобрение</span>
                        <span class="item-price">150 💰</span>
                    </div>
                    <button class="btn btn-buy" onclick="buyItem('fertilizer', 150)">КУПИТЬ</button>
                </div>
                <div class="shop-item">
                    <div class="item-info">
                        <span class="item-name">🚁 Дрон-опрыскиватель</span>
                        <span class="item-price">600 💰</span>
                    </div>
                    <button class="btn btn-buy" onclick="buyItem('drone_v2', 600)">КУПИТЬ</button>
                </div>
                <div class="shop-item">
                    <div class="item-info">
                        <span class="item-name">🤖 Авто-система</span>
                        <span class="item-price">2500 💰</span>
                    </div>
                    <button class="btn btn-buy" onclick="buyItem('auto_system', 2500)">КУПИТЬ</button>
                </div>
            </div>
        </div>
    </div>

    <nav id="bottomNav" class="nav-bar hidden">
        <div class="nav-item active" onclick="showScreen('profile')">👤 ПРОФИЛЬ</div>
        <div class="nav-item" onclick="showScreen('city')">🏙️ ГОРОД</div>
    </nav>

    <script>
        // === ТВОЙ CONFIG FIREBASE ===
        const firebaseConfig = {
            apiKey: "ТВОЙ_API_KEY",
            authDomain: "ТВОЙ_ПРОЕКТ.firebaseapp.com",
            projectId: "ТВОЙ_ПРОЕКТ",
            storageBucket: "ТВОЙ_ПРОЕКТ.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userData = null;

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        function showScreen(screen) {
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('cityScreen').classList.add('hidden');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

            if (screen === 'profile') {
                document.getElementById('profileScreen').classList.remove('hidden');
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            } else {
                document.getElementById('cityScreen').classList.remove('hidden');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('bottomNav').classList.remove('hidden');
                loadData(user);
            }
        });

        function loadData(user) {
            const docRef = db.collection("players").doc(user.uid);
            docRef.onSnapshot(doc => {
                if (doc.exists) {
                    userData = doc.data();
                    renderUI(userData);
                } else {
                    const freshUser = { name: user.displayName || "Фермер", photo: user.photoURL || "", level: 1, coins: 1000, inv: [] };
                    docRef.set(freshUser);
                }
            });
        }

        function renderUI(data) {
            document.getElementById('userName').innerText = data.name;
            document.getElementById('userAvatar').src = data.photo || "https://via.placeholder.com/150";
            document.getElementById('userLevel').innerText = data.level;
            document.getElementById('coinDisplay').innerText = data.coins.toLocaleString();
            document.getElementById('shopCoinDisplay').innerText = data.coins.toLocaleString();
            document.getElementById('editName').value = data.name;
            document.getElementById('editPhoto').value = data.photo;
        }

        async function buyItem(id, price) {
            if (userData.coins >= price) {
                await db.collection("players").doc(auth.currentUser.uid).update({
                    coins: firebase.firestore.FieldValue.increment(-price),
                    inv: firebase.firestore.FieldValue.arrayUnion(id)
                });
                alert("Успешно куплено!");
            } else {
                alert("Недостаточно монет!");
            }
        }

        async function saveProfile() {
            await db.collection("players").doc(auth.currentUser.uid).update({
                name: document.getElementById('editName').value,
                photo: document.getElementById('editPhoto').value
            });
            alert("Данные обновлены!");
        }
    </script>
</body>
</html>
