<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRO-NATION | Профиль</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; }
        .hidden { display: none; }
        .profile-card { background: #2a2a2a; padding: 20px; border-radius: 15px; width: 300px; margin: 50px auto; border: 1px solid #4CAF50; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #4CAF50; }
        input { background: #333; color: #fff; border: 1px solid #555; padding: 5px; margin: 5px 0; }
        .btn { background: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="authScreen">
        <h1>AGRO-NATION</h1>
        <button class="btn" onclick="login()">Войти через Google 🚜</button>
    </div>

    <div id="profileScreen" class="hidden">
        <div class="profile-card">
            <img id="userAvatar" class="avatar" src="" alt="Avatar">
            <h2 id="userName">Агроном</h2>
            <p>Уровень: <span id="userLevel">1</span> ⭐</p>
            <p>Монеты: <span id="userCoins">100</span> 💰</p>
            <hr>
            <input type="text" id="editName" placeholder="Изменить имя">
            <input type="text" id="editPhoto" placeholder="Ссылка на фото">
            <button class="btn" onclick="saveProfile()">Сохранить профиль</button>
            <button class="btn" style="background:#555" onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        // ВСТАВЬ СВОЙ КОНФИГ ИЗ FIREBASE ТУТ
        const firebaseConfig = {
            apiKey: "ТВОЙ_КЛЮЧ",
            authDomain: "ТВОЙ_ПРОЕКТ.firebaseapp.com",
            projectId: "ТВОЙ_ПРОЕКТ",
            storageBucket: "ТВОЙ_ПРОЕКТ.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('profileScreen').classList.remove('hidden');
                loadUserData(user);
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('profileScreen').classList.add('hidden');
            }
        });

        async function loadUserData(user) {
            const doc = await db.collection("players").doc(user.uid).get();
            if (doc.exists) {
                const data = doc.data();
                updateUI(data);
            } else {
                // Создаем профиль новичка
                const newUser = {
                    name: user.displayName,
                    photo: user.photoURL,
                    level: 1,
                    coins: 100,
                    exp: 0
                };
                await db.collection("players").doc(user.uid).set(newUser);
                updateUI(newUser);
            }
        }

        function updateUI(data) {
            document.getElementById('userName').innerText = data.name;
            document.getElementById('userAvatar').src = data.photo;
            document.getElementById('userLevel').innerText = data.level;
            document.getElementById('userCoins').innerText = data.coins;
        }

        async function saveProfile() {
            const newName = document.getElementById('editName').value;
            const newPhoto = document.getElementById('editPhoto').value;
            const user = auth.currentUser;
            
            let updates = {};
            if(newName) updates.name = newName;
            if(newPhoto) updates.photo = newPhoto;

            if(Object.keys(updates).length > 0) {
                await db.collection("players").doc(user.uid).update(updates);
                alert("Данные обновлены!");
                location.reload();
            }
        }
    </script>
</body>
</html>
