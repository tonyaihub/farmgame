<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnotherF**kFarmGame | Game</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary-green: #4CAF50;
            --accent-neon: #8BC34A;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --gold: #FFD700;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden; padding-bottom: 90px;
        }

        /* --- Логотип --- */
        .header-logo { margin-top: 40px; text-align: center; width: 90%; max-width: 600px; }
        .logo-text {
            font-size: 3.2rem; font-weight: 900; letter-spacing: -2px; line-height: 1;
            background: linear-gradient(135deg, #fff 10%, var(--accent-neon) 60%, var(--primary-green) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(76, 175, 80, 0.4);
        }

        /* --- Анимация --- */
        .animation-container {
            width: 100%; height: 140px; position: relative; overflow: hidden; margin-top: 10px;
            background: linear-gradient(to bottom, transparent, rgba(76, 175, 80, 0.05) 70%, transparent);
            border-bottom: 2px solid rgba(76, 175, 80, 0.1);
        }
        .tractor { font-size: 6rem; position: absolute; bottom: -10px; left: -150px; transform: scaleX(-1); animation: driveRight 14s linear infinite; z-index: 2; }
        .drone { font-size: 2.8rem; position: absolute; bottom: 70px; left: -50px; transform: scaleX(-1); animation: flyRight 14s linear infinite; z-index: 1; filter: drop-shadow(0 0 15px var(--accent-neon)); }

        @keyframes driveRight { 0% { left: -200px; } 100% { left: 110%; } }
        @keyframes flyRight { 
            0% { left: -50px; transform: translateY(0px) scaleX(-1); }
            50% { transform: translateY(-15px) scaleX(-1); }
            100% { left: calc(110% + 150px); transform: translateY(0px) scaleX(-1); }
        }

        /* --- Контейнеры --- */
        .main-container { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 25px; }
        .hidden { display: none !important; }

        .game-card {
            background-color: var(--card-bg); padding: 25px; border-radius: 20px; width: 85%; max-width: 400px;
            border: 1px solid rgba(139, 195, 74, 0.15); box-shadow: 0 15px 40px rgba(0,0,0,0.6); text-align: center;
        }

        .avatar { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--primary-green); object-fit: cover; }
        .user-coins { color: var(--gold); font-weight: bold; font-size: 1.6rem; margin: 10px 0; }

        /* --- Кнопки --- */
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin: 5px 0; width: 100%; }
        .btn-start { background: linear-gradient(135deg, #FFEB3B, #FBC02D); color: #000; font-size: 1.2rem; text-transform: uppercase; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(255, 235, 59, 0.3); }
        .btn-start:hover { transform: scale(1.05); }
        .btn-save { background: var(--primary-green); color: white; }
        .btn-buy { background: var(--accent-neon); color: var(--dark-bg); width: auto; }

        /* --- Игровое поле (Ферма) --- */
        .farm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .plot { background: #3e2723; height: 80px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; border: 2px solid #5d4037; }

        /* --- Навигация --- */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid var(--primary-green); z-index: 100; }
        .nav-item { color: #666; text-decoration: none; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .nav-item.active { color: var(--accent-neon); }

        input[type="text"] { width: 100%; background: #222; color: #fff; border: 1px solid #333; padding: 10px; margin: 5px 0; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header-logo">
        <div class="logo-text">AnotherF**kFarmGame</div>
    </div>

    <div class="animation-container" id="topAnim">
        <div class="drone">🛸</div>
        <div class="tractor">🚜</div>
    </div>

    <div class="main-container">
        <div id="authScreen">
            <button class="btn" style="background:white; color:#333; width: auto; padding: 15px 30px;" onclick="login()">Войти через Google</button>
        </div>

        <div id="profileScreen" class="game-card hidden">
            <button class="btn btn-start" onclick="showScreen('farm')">🚀 Начать игру</button>
            <img id="userAvatar" class="avatar" src="" alt="Avatar">
            <h2 id="userName" style="margin:5px 0;">Фермер</h2>
            <div class="user-coins"><span id="coinDisplay">0</span> 💰</div>
            
            <div style="text-align: left; margin-top: 10px;">
                <input type="text" id="editName" placeholder="Никнейм">
                <input type="text" id="editPhoto" placeholder="URL аватара">
            </div>
            <button class="btn btn-save" onclick="saveProfile()">Сохранить изменения</button>
            <button onclick="logout()" style="background:none; border:none; color:#ff4444; margin-top:10px; cursor:pointer;">Выйти</button>
        </div>

        <div id="farmScreen" class="game-card hidden">
            <h2 style="margin:0;">Твоя Ферма</h2>
            <div class="user-coins"><span id="farmCoinDisplay">0</span> 💰</div>
            <div class="farm-grid">
                <div class="plot" onclick="plant(this)">🟤</div>
                <div class="plot" onclick="plant(this)">🟤</div>
                <div class="plot" onclick="plant(this)">🟤</div>
                <div class="plot" onclick="plant(this)">🟤</div>
                <div class="plot" onclick="plant(this)">🟤</div>
                <div class="plot" onclick="plant(this)">🟤</div>
            </div>
            <p style="font-size: 0.8rem; margin-top: 15px; opacity: 0.6;">Нажми на грядку, чтобы посадить урожай</p>
        </div>

        <div id="cityScreen" class="game-card hidden">
            <h2 style="margin:0;">Рынок</h2>
            <div class="shop-item" style="background:none; border:none;">
                <button class="btn btn-buy" onclick="buyItem('seeds', 50)">Купить семена (50 💰)</button>
            </div>
        </div>
    </div>

    <nav id="bottomNav" class="nav-bar hidden">
        <div class="nav-item active" onclick="showScreen('profile')">👤 ПРОФИЛЬ</div>
        <div class="nav-item" onclick="showScreen('farm')">🚜 ФЕРМА</div>
        <div class="nav-item" onclick="showScreen('city')">🏙️ ГОРОД</div>
    </nav>

    <script>
        const firebaseConfig = { apiKey: "API_KEY", authDomain: "ID.firebaseapp.com", projectId: "ID", storageBucket: "ID.appspot.com", messagingSenderId: "ID", appId: "ID" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let userData = null;

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut().then(() => location.reload()); }

        function showScreen(screen) {
            document.querySelectorAll('.game-card').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(screen + 'Screen').classList.remove('hidden');
            
            // Подсветка иконок в навбаре
            const navIndex = { 'profile': 0, 'farm': 1, 'city': 2 };
            document.querySelectorAll('.nav-item')[navIndex[screen]].classList.add('active');
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('bottomNav').classList.remove('hidden');
                db.collection("players").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        userData = doc.data();
                        document.getElementById('userName').innerText = userData.name;
                        document.getElementById('userAvatar').src = userData.photo || "https://via.placeholder.com/150";
                        document.getElementById('coinDisplay').innerText = userData.coins;
                        document.getElementById('farmCoinDisplay').innerText = userData.coins;
                        document.getElementById('editName').value = userData.name;
                        document.getElementById('editPhoto').value = userData.photo;
                    } else {
                        db.collection("players").doc(user.uid).set({ name: user.displayName, coins: 1000, level: 1 });
                    }
                });
                showScreen('profile');
            }
        });

        function plant(el) {
            if(el.innerText === '🟤') {
                el.innerText = '🌱';
                setTimeout(() => { el.innerText = '🌽'; }, 3000);
            } else if (el.innerText === '🌽') {
                el.innerText = '🟤';
                db.collection("players").doc(auth.currentUser.uid).update({ coins: firebase.firestore.FieldValue.increment(20) });
            }
        }

        async function saveProfile() {
            await db.collection("players").doc(auth.currentUser.uid).update({ name: document.getElementById('editName').value, photo: document.getElementById('editPhoto').value });
            alert("Сохранено!");
        }
    </script>
</body>
</html>
