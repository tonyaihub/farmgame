<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік чергування — Система</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --active-bg: #fff9db; --body-bg: #f0f2f5; --card-bg: white; --text: #2c3e50;
            --grad: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        body.dark-theme {
            --body-bg: #1a1a1a; --card-bg: #2d2d2d; --text: #ecf0f1;
            --light: #3d3d3d; --active-bg: #4d4520;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--body-bg); margin: 0; padding: 10px; color: var(--text); transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; background: var(--card-bg); padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        
        .header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--light); padding-bottom: 15px; }
        .header-title h1 { margin: 0; font-size: 2.5em; font-weight: 800; line-height: 1; }
        .header-title small { display: block; color: #7f8c8d; font-size: 1.1em; font-weight: bold; }
        .time-area { text-align: center; }
        #clock { font-size: 2.5em; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
        
        .top-right-tool { display: flex; justify-content: flex-end; gap: 10px; }
        .tool-btn { background: var(--light); width: 45px; height: 45px; border-radius: 10px; font-size: 20px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; color: var(--text); transition: 0.2s; }
        .tool-btn:hover { filter: brightness(1.1); }
        .tool-btn.active { background: var(--warning); box-shadow: 0 0 10px var(--warning); }

        .top-controls { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 25px; }
        .group-selector { width: 100%; padding: 18px; border: none; border-radius: 0 0 12px 12px; background: var(--grad); color: white; font-size: 1.3em; font-weight: 800; cursor: pointer; text-align: center; outline: none; appearance: none; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
        .personnel-display { background: var(--light); border-radius: 8px; padding: 4px 15px; display: flex; justify-content: space-around; font-weight: bold; align-items: center; min-height: 35px; }

        table { width: 100%; border-collapse: collapse; }
        th { background: var(--light); padding: 12px 15px; text-align: left; border-bottom: 3px solid var(--accent); color: var(--text); font-size: 0.9em; text-transform: uppercase; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--light); vertical-align: top; }

        @keyframes pulse { 0% { background-color: var(--active-bg); } 50% { filter: brightness(1.15); } 100% { background-color: var(--active-bg); } }
        .current-task-row { animation: pulse 2s infinite; border-left: 10px solid var(--warning) !important; font-weight: bold; }
        body.dim-past .past-task-row { opacity: 0.35; filter: grayscale(80%); }

        .footer { margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 18px 30px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; width: 100%; font-size: 1.1em; }
        .btn-success { background: var(--success); color: white; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
        .btn-success:disabled { background: #95a5a6 !important; opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
        .status-msg { font-size: 0.95em; text-align: center; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body class="dim-past">

<div class="container">
    <div class="header">
        <div class="header-title"><h1>Графік</h1><small>чергувань</small></div>
        <div class="time-area"><span id="current-date">--.--.----</span><div id="clock">00:00:00</div></div>
        <div class="top-right-tool">
            <button class="tool-btn" onclick="toggleTheme()" title="Змінити тему">🌓</button>
            <button class="tool-btn active" id="lightBtn" onclick="toggleDimming()" title="Затемнення минулого">💡</button>
        </div>
    </div>

    <div class="top-controls">
        <select id="groupSelect" class="group-selector" onchange="changeShift(this.value)">
            <option value="1">Зміна №1</option>
            <option value="2">Зміна №2</option>
        </select>
        <div class="personnel-display" id="names-box"></div>
    </div>

    <table id="mainTable">
        <thead><tr><th>План</th><th>Виконавець</th><th>На посту</th><th style="text-align:center;">Звіт</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="footer">
        <div id="statusMessage" class="status-msg"></div>
        <button id="nextShiftBtn" class="btn btn-success" disabled onclick="transferShift()">↻ Наступна зміна</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    let logs = JSON.parse(localStorage.getItem('duty_logs')) || {};
    let currentShiftNum = parseInt(localStorage.getItem('active_shift')) || 1;
    let lastNotifiedIdx = null;

    if(localStorage.getItem('dark_theme') === 'true') document.body.classList.add('dark-theme');
    if (Notification.permission !== 'granted') Notification.requestPermission();

    function playSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [600, 800].forEach((freq, i) => {
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.1, ctx.currentTime + i*0.3);
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.3 + 0.2);
                o.start(ctx.currentTime + i*0.3); o.stop(ctx.currentTime + i*0.3 + 0.2);
            });
        } catch(e) { console.log("Audio play blocked"); }
    }

    const scheduleData = (names) => [
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]}
    ];

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-theme');
        localStorage.setItem('dark_theme', isDark);
    }

    function toggleDimming() {
        document.body.classList.toggle('dim-past');
        document.getElementById('lightBtn').classList.toggle('active');
    }

    function render() {
        const now = new Date();
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const schedule = scheduleData(names);

        let shiftStart = new Date(now);
        shiftStart.setHours(8, 0, 0, 0);
        if (now.getHours() < 8) shiftStart.setDate(shiftStart.getDate() - 1);

        document.getElementById('current-date').innerText = shiftStart.toLocaleDateString('uk-UA');
        document.getElementById('names-box').innerHTML = names.map(n => `<span>${n}</span>`).join('');
        document.getElementById('groupSelect').value = currentShiftNum;
        tbody.innerHTML = '';

        let processedCount = 0;

        schedule.forEach((row, index) => {
            const tr = tbody.insertRow();
            const [h, m] = row.t.split(':').map(Number);
            let tT = new Date(shiftStart);
            tT.setHours(h, m, 0, 0);
            if (h < 8) tT.setDate(tT.getDate() + 1);
            
            const diffMin = (now - tT) / 60000;

            // Логіка сповіщень (активне вікно 1 хвилина)
            if (diffMin >= 0 && diffMin < 1 && lastNotifiedIdx !== index) {
                playSound();
                if (Notification.permission === "granted") {
                    new Notification("ЧАС ОБХОДУ!", { body: `Виконавець: ${row.exec}`, icon: "https://cdn-icons-png.flaticon.com/512/311/311081.png" });
                }
                lastNotifiedIdx = index;
            }

            if (diffMin >= 0 && diffMin < 60) tr.className = 'current-task-row';
            else if (diffMin >= 60) tr.className = 'past-task-row';

            let checkHtml = "";
            if (row.task === 'walk') {
                if (logs[index]) {
                    checkHtml = `<b style="color:var(--success)">✓ ${logs[index]}</b>`;
                    processedCount++;
                } else if (diffMin > 60) {
                    checkHtml = `<small style="color:var(--danger); font-weight:bold;">ВТРАЧЕНО</small>`;
                    processedCount++; 
                } else if (diffMin < 0) {
                    checkHtml = `<span style="opacity:0.3">---</span>`;
                } else {
                    checkHtml = `<input type="checkbox" style="width:20px; height:20px; cursor:pointer;" onchange="mark(${index})">`;
                }
            } else {
                checkHtml = `<small style="opacity:0.6">сон</small>`;
            }

            tr.innerHTML = `<td><b>${row.t}</b></td><td>${row.exec}</td><td>${row.post.join('<br>')}</td><td align="center">${checkHtml}</td>`;
        });

        checkShiftCompletion(schedule, processedCount, now);
    }

    function checkShiftCompletion(schedule, processedCount, now) {
        const totalWalks = schedule.filter(r => r.task === 'walk').length;
        const btn = document.getElementById('nextShiftBtn');
        const msg = document.getElementById('statusMessage');

        const isAfterEight = now.getHours() >= 8;

        if (processedCount < totalWalks) {
            btn.disabled = true;
            msg.innerText = `Оброблено: ${processedCount} з ${totalWalks} обходів`;
            msg.style.color = "var(--danger)";
        } else if (!isAfterEight) {
            btn.disabled = true;
            msg.innerText = "Здача зміни стане доступною о 08:00";
            msg.style.color = "#e67e22";
        } else {
            btn.disabled = false;
            msg.innerText = "Зміну завершено. Готово до перемикання.";
            msg.style.color = "var(--success)";
        }
    }

    function mark(id) { 
        logs[id] = new Date().toLocaleTimeString('uk-UA').slice(0, 5); 
        localStorage.setItem('duty_logs', JSON.stringify(logs)); 
        render(); 
    }

    function changeShift(n) { 
        currentShiftNum = parseInt(n); 
        localStorage.setItem('active_shift', n); 
        render(); 
    }

    function transferShift() { 
        if(confirm("Перейти до наступної зміни? Поточні відмітки будуть видалені.")) { 
            logs = {}; 
            localStorage.removeItem('duty_logs'); 
            currentShiftNum = currentShiftNum === 1 ? 2 : 1;
            localStorage.setItem('active_shift', currentShiftNum);
            render(); 
        } 
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA');
        if (new Date().getSeconds() === 0) render();
    }, 1000);

    render();
</script>
</body>
</html>
