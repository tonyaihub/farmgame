<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Графік чергування (Button Timer)</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --active-bg: #fff9db; --body-bg: #f0f2f5; --card-bg: white; --text: #2c3e50;
            --grad: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            --sleep-bg: #e3f2fd; --sleep-text: #1565c0;
            --next-bg: #f8f9fa;
        }

        body.dark-theme {
            --body-bg: #1a1a1a; --card-bg: #2d2d2d; --text: #ecf0f1;
            --light: #3d3d3d; --active-bg: #4d4520;
            --sleep-bg: #0d47a1; --sleep-text: #bbdefb;
            --next-bg: #252525;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--body-bg); margin: 0; padding: 5px; color: var(--text); transition: 0.3s; overflow-x: hidden; }
        .container { max-width: 1000px; margin: auto; background: var(--card-bg); padding: 12px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid var(--light); padding-bottom: 8px; gap: 8px; }
        .header-left { flex: 1; }
        .header-left h1 { margin: 0; font-size: 1.1em; font-weight: 800; line-height: 1; letter-spacing: 1px; }
        .header-left small { font-size: 0.7em; color: #7f8c8d; font-weight: bold; }

        .status-monitor-top { flex: 2; text-align: center; background: var(--next-bg); padding: 4px 8px; border-radius: 8px; min-width: 145px; border: 1px solid rgba(0,0,0,0.05); transition: 0.3s; }
        .status-monitor-top .label { font-size: 0.55em; text-transform: uppercase; font-weight: 800; color: #7f8c8d; display: block; margin-bottom: -2px; }
        .status-monitor-top .timer { font-family: 'Consolas', monospace; font-size: 1.1em; font-weight: 900; color: var(--accent); display: block; white-space: nowrap; }
        
        .status-monitor-top.active-sleep { background: var(--sleep-bg); border-color: var(--accent); }
        .status-monitor-top.warning .timer { color: var(--danger); animation: blink 1s infinite; }
        .status-monitor-top.soon .timer { color: #e67e22; }

        .header-right { flex: 1; text-align: right; }
        #clock { font-size: 1.3em; font-weight: 800; color: var(--dark); display: block; line-height: 1; font-variant-numeric: tabular-nums; }
        .tool-btn { background: var(--light); width: 30px; height: 30px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; margin-top: 4px; color: var(--text); }

        .top-controls { margin-bottom: 12px; }
        .group-selector { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--grad); color: white; font-size: 1em; font-weight: 800; text-align: center; appearance: none; }
        
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 310px; }
        th { background: var(--light); padding: 6px 4px; text-align: left; font-size: 0.65em; text-transform: uppercase; border-bottom: 2px solid var(--accent); }
        td { padding: 8px 4px; border-bottom: 1px solid var(--light); font-size: 0.75em; }

        .current-task-row { background-color: var(--active-bg); font-weight: bold; border-left: 4px solid var(--warning) !important; animation: pulse 2s infinite; }
        .sleep-row { color: var(--sleep-text); background-color: var(--sleep-bg); }
        .past-task-row { opacity: 0.5; filter: grayscale(50%); }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        @keyframes pulse { 0% { background-color: var(--active-bg); } 50% { filter: brightness(1.05); } 100% { background-color: var(--active-bg); } }
        
        .footer { margin-top: 15px; text-align: center; }
        .btn { padding: 14px; border-radius: 25px; border: none; font-weight: bold; width: 100%; font-size: 0.9em; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-success { background: var(--success); color: white; }
        .btn:disabled { background: #dcdde1; color: #7f8c8d; cursor: not-allowed; box-shadow: none; font-family: 'Consolas', monospace; }
        body.dark-theme .btn:disabled { background: #353b48; color: #718093; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>ГРАФІК</h1>
            <small id="current-date">--.--.----</small>
        </div>
        
        <div id="statusMonitor" class="status-monitor-top">
            <span id="monitorLabel" class="label">Завантаження</span>
            <span id="topTimer" class="timer">--:--:--</span>
        </div>

        <div class="header-right">
            <span id="clock">00:00:00</span>
            <button class="tool-btn" onclick="toggleTheme()">🌓</button>
        </div>
    </div>

    <div class="top-controls">
        <select id="groupSelect" class="group-selector" onchange="changeShift(this.value)">
            <option value="1">Зміна №1</option>
            <option value="2">Зміна №2</option>
        </select>
    </div>

    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
                <tr>
                    <th style="width: 25%;">План</th>
                    <th style="width: 30%;">Завдання</th>
                    <th style="width: 25%;">Пост</th>
                    <th style="width: 20%; text-align:center;">Звіт</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer">
        <div id="statusMessage" style="font-size: 0.85em; font-weight: 800; margin-bottom: 10px; color: var(--primary);"></div>
        <button id="nextShiftBtn" class="btn" disabled onclick="transferShift()">Наступна зміна</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    let logs = JSON.parse(localStorage.getItem('duty_logs')) || {};
    let currentShiftNum = parseInt(localStorage.getItem('active_shift')) || 1;

    if(localStorage.getItem('dark_theme') === 'true') document.body.classList.add('dark-theme');

    const scheduleData = (names) => [
        {t: "08:00-08:20", startH: 8, startM: 0, task: "walk", label: "Зміна чергових", exec: "Всі", post: [names[0], names[1], names[2]], dur: 20},
        {t: "08:20", startH: 8, startM: 20, task: "walk", exec: names[0], post: [names[1], names[2]], dur: 60},
        {t: "09:20", startH: 9, startM: 20, task: "walk", exec: names[1], post: [names[0], names[2]], dur: 60},
        {t: "10:20", startH: 10, startM: 20, task: "walk", exec: names[2], post: [names[0], names[1]], dur: 60},
        {t: "11:20", startH: 11, startM: 20, task: "walk", exec: names[0], post: [names[1], names[2]], dur: 60},
        {t: "12:20", startH: 12, startM: 20, task: "walk", exec: names[1], post: [names[0], names[2]], dur: 60},
        {t: "13:20", startH: 13, startM: 20, task: "walk", exec: names[2], post: [names[0], names[1]], dur: 60},
        {t: "14:20", startH: 14, startM: 20, task: "walk", exec: names[0], post: [names[1], names[2]], dur: 60},
        {t: "15:20", startH: 15, startM: 20, task: "walk", exec: names[1], post: [names[0], names[2]], dur: 60},
        {t: "16:20", startH: 16, startM: 20, task: "walk", exec: names[2], post: [names[0], names[1]], dur: 60},
        {t: "17:20", startH: 17, startM: 20, task: "walk", exec: names[0], post: [names[1], names[2]], dur: 60},
        {t: "18:20", startH: 18, startM: 20, task: "walk", exec: names[1], post: [names[0], names[2]], dur: 60},
        {t: "19:20", startH: 19, startM: 20, task: "walk", exec: names[2], post: [names[0], names[1]], dur: 60},
        {t: "20:00", startH: 20, startM: 0, task: "sleep", exec: names[0], post: [names[1], names[2]], dur: 120},
        {t: "20:20", startH: 20, startM: 20, task: "walk", exec: names[1], post: [names[2]], dur: 120},
        {t: "22:20", startH: 22, startM: 20, task: "walk", exec: names[2], post: [names[1]], dur: 100},
        {t: "00:00", startH: 0, startM: 0, task: "sleep", exec: names[1], post: [names[0], names[2]], dur: 120},
        {t: "00:20", startH: 0, startM: 20, task: "walk", exec: names[0], post: [names[2]], dur: 120},
        {t: "02:20", startH: 2, startM: 20, task: "walk", exec: names[2], post: [names[0]], dur: 100},
        {t: "04:00", startH: 4, startM: 0, task: "sleep", exec: names[2], post: [names[0], names[1]], dur: 120},
        {t: "04:20", startH: 4, startM: 20, task: "walk", exec: names[0], post: [names[1]], dur: 120},
        {t: "06:20", startH: 6, startM: 20, task: "walk", exec: names[1], post: [names[0]], dur: 25},
        {t: "06:45-08:00", startH: 6, startM: 45, task: "walk", label: "Підготовка", exec: "До зміни", post: [names[0], names[1]], dur: 75}
    ];

    function formatCountdown(ms) {
        if (ms < 0) return "00:00:00";
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return [hours, minutes, seconds].map(v => v.toString().padStart(2, '0')).join(':');
    }

    function render() {
        const now = new Date();
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const schedule = scheduleData(names);

        let shiftStart = new Date(now);
        if (now.getHours() < 8) shiftStart.setDate(shiftStart.getDate() - 1);
        shiftStart.setHours(8, 0, 0, 0);

        document.getElementById('current-date').innerText = shiftStart.toLocaleDateString('uk-UA');
        tbody.innerHTML = '';

        let activeSleep = null;
        let nextWalkTime = null;
        let processedCount = 0;
        let totalWalks = 0;

        schedule.forEach((row, index) => {
            const tr = tbody.insertRow();
            let taskStartTime = new Date(shiftStart);
            taskStartTime.setHours(row.startH, row.startM, 0, 0);
            if (row.startH < 8) taskStartTime.setDate(taskStartTime.getDate() + 1);
            
            const taskEndTime = new Date(taskStartTime.getTime() + row.dur * 60000);
            const isCurrentlyActive = (now >= taskStartTime && now < taskEndTime);

            if (row.task === 'walk' && taskStartTime > now && !nextWalkTime) {
                nextWalkTime = taskStartTime;
            }

            let checkHtml = "";

            if (row.task === 'sleep') {
                tr.classList.add('sleep-row');
                if (isCurrentlyActive) {
                    tr.classList.add('current-task-row');
                    activeSleep = { name: row.exec, end: taskEndTime };
                    checkHtml = `<b>${formatCountdown(taskEndTime - now)}</b>`;
                } else {
                    checkHtml = `<small>${now >= taskEndTime ? 'завершено' : 'сон'}</small>`;
                    if (now >= taskEndTime) tr.classList.add('past-task-row');
                }
            } else {
                totalWalks++;
                if (isCurrentlyActive) tr.classList.add('current-task-row');
                else if (now >= taskEndTime) tr.classList.add('past-task-row');

                if (logs[index]) {
                    checkHtml = `<b style="color:var(--success)">✓ ${logs[index]}</b>`;
                    processedCount++;
                } else if (now >= taskEndTime) {
                    checkHtml = `<small style="color:var(--danger)">ВТРАЧЕНО</small>`;
                    processedCount++;
                } else if (now < taskStartTime) {
                    checkHtml = `<span style="opacity:0.3">...</span>`;
                } else {
                    checkHtml = `<input type="checkbox" style="width:18px;height:18px" onchange="mark(${index})">`;
                }
            }

            const label = row.label ? `<b>${row.label}</b>` : row.exec;
            tr.innerHTML = `<td><b>${row.t}</b></td><td>${label}</td><td>${row.post.join(', ')}</td><td align="center">${checkHtml}</td>`;
        });

        // МОНИТОР В ШАПКЕ
        const monitor = document.getElementById('statusMonitor');
        const labelText = document.getElementById('monitorLabel');
        const timerText = document.getElementById('topTimer');

        if (activeSleep) {
            const remaining = activeSleep.end - now;
            monitor.className = "status-monitor-top active-sleep" + (remaining < 600000 ? " warning" : "");
            labelText.innerText = "Відпочинок";
            timerText.innerText = activeSleep.name + ": " + formatCountdown(remaining);
        } else if (nextWalkTime && now.getHours() >= 8 && now.getHours() < 20) {
            const toNext = nextWalkTime - now;
            monitor.className = "status-monitor-top" + (toNext < 300000 ? " soon" : "");
            labelText.innerText = "Наступний обхід через";
            timerText.innerText = formatCountdown(toNext);
        } else {
            monitor.className = "status-monitor-top";
            labelText.innerText = "Статус";
            timerText.innerText = "--:--:--";
        }

        updateStatus(processedCount, totalWalks, now, shiftStart);
    }

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-theme');
        localStorage.setItem('dark_theme', isDark);
    }

    function updateStatus(processed, total, now, shiftStart) {
        const btn = document.getElementById('nextShiftBtn');
        const msg = document.getElementById('statusMessage');
        
        // Время пересменки (08:00 следующего дня относительно начала смены)
        const targetTime = new Date(shiftStart);
        targetTime.setDate(targetTime.getDate() + 1);
        targetTime.setHours(8, 0, 0, 0);

        // Начало отсчета на кнопке (06:45)
        const countdownStartTime = new Date(targetTime);
        countdownStartTime.setMinutes(-75); 

        const allDone = processed >= total;
        const isPastTarget = now >= targetTime;

        if (allDone && isPastTarget) {
            btn.disabled = false;
            btn.classList.add('btn-success');
            btn.innerText = "↻ Здати зміну";
            msg.innerText = "ГОТОВО ДО ПЕРЕЗМІНКИ!";
            msg.style.color = "var(--success)";
        } else {
            btn.disabled = true;
            btn.classList.remove('btn-success');
            msg.innerText = "ПЕРЕЗМІНКА О 08:00";
            msg.style.color = "var(--primary)";

            // Если время между 06:45 и 08:00, показываем таймер на кнопке
            if (now >= countdownStartTime && now < targetTime) {
                const diff = targetTime - now;
                btn.innerText = "До перезмінки: " + formatCountdown(diff);
            } else {
                btn.innerText = "Наступна зміна";
            }
        }
    }

    function mark(id) { 
        logs[id] = new Date().toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'}); 
        localStorage.setItem('duty_logs', JSON.stringify(logs)); 
        render(); 
    }

    function changeShift(n) { 
        currentShiftNum = parseInt(n); 
        localStorage.setItem('active_shift', n); 
        render(); 
    }

    function transferShift() { 
        if(confirm("Здати зміну? Усі записи буде очищено.")) { 
            logs = {}; localStorage.removeItem('duty_logs'); 
            currentShiftNum = (currentShiftNum === 1) ? 2 : 1;
            localStorage.setItem('active_shift', currentShiftNum);
            render(); 
        } 
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA');
        render();
    }, 1000);

    render();
</script>
</body>
</html>
