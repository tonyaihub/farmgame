<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік чергування</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f39c12; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --grad: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: var(--primary); }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--light); padding-bottom: 15px; margin-bottom: 15px; }
        .header-title h2 { margin: 0; color: var(--primary); }
        .header-title #current-date { color: var(--accent); font-weight: 800; }
        #clock { font-size: 1.4em; font-weight: bold; color: var(--accent); background: #f8f9fa; padding: 5px 15px; border-radius: 8px; border: 1px solid #eee; }

        .control-panel { display: flex; align-items: stretch; gap: 15px; margin-bottom: 25px; }
        .selector-box { flex: 1; }
        .group-selector {
            width: 100%; height: 100%; background: var(--dark); color: white; border: none; border-radius: 10px;
            padding: 12px 20px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .group-selector:hover { background: #2c3e50; }
        
        .personnel-list { 
            flex: 1; background: #f8f9fa; border: 1px solid var(--light); border-radius: 10px; 
            padding: 10px 20px; display: flex; align-items: center; justify-content: space-around;
        }
        .person-tag { font-weight: bold; color: var(--dark); font-size: 0.95em; position: relative; padding-left: 15px; }
        .person-tag::before { content: '•'; position: absolute; left: 0; color: var(--accent); }

        /* ВИДІЛЕННЯ ПОТОЧНОГО ПУНКТУ */
        .active-row { 
            background: #fffdf2 !important; 
            border-left: 5px solid var(--accent) !important;
            box-shadow: inset 0 0 10px rgba(52, 152, 219, 0.1);
        }
        .active-row td { font-weight: 500; }
        .active-executor { background: var(--warning) !important; color: white !important; font-weight: bold; border-radius: 4px; padding: 4px 8px; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px 15px; text-align: left; border-bottom: 3px solid var(--light); font-size: 0.85em; text-transform: uppercase; color: #7f8c8d; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        
        /* Список на посту */
        .post-names { display: block; line-height: 1.4; color: #555; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7em; font-weight: bold; text-transform: uppercase; }
        .walk { background: #d1ecf1; color: #0c5460; }
        .sleep { background: #e2e3e5; color: #383d41; }
        
        .log-time { font-size: 0.9em; color: var(--success); font-weight: bold; }
        .expired-text { color: var(--danger); font-weight: bold; font-size: 0.75em; text-transform: uppercase; border: 1px solid var(--danger); padding: 2px 4px; border-radius: 3px; }

        .footer { margin-top: 25px; padding: 20px; border-top: 2px solid var(--light); text-align: center; }
        #nextShiftBtn { padding: 15px 40px; font-size: 1em; font-weight: 800; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        #nextShiftBtn:disabled { background: #eee; color: #aaa; }
        #nextShiftBtn:enabled { background: var(--grad); color: white; box-shadow: 0 8px 15px rgba(52, 152, 219, 0.3); }

        .alert-box { color: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: center; animation: pulse 2s infinite; }
        .alert-box.orange { background: var(--warning); }
        .alert-box.blue { background: var(--accent); animation: none; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.01);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <h2>Графік чергування на <span id="current-date">--.--.----</span></h2>
            <small>Поточний контроль виконання плану</small>
        </div>
        <div id="clock">--:--:--</div>
    </div>

    <div class="control-panel">
        <div class="selector-box">
            <select id="groupSelect" class="group-selector" onchange="setShift(this.value)">
                <option value="1">АКТИВНА: ЗМІНА №1</option>
                <option value="2">АКТИВНА: ЗМІНА №2</option>
            </select>
        </div>
        <div class="personnel-list" id="personnel-display"></div>
    </div>

    <div id="alert-container"></div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>План</th>
                <th>Тип</th>
                <th>ВИКОНАВЕЦЬ</th>
                <th>На посту</th>
                <th style="text-align:center;">Звіт</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="footer">
        <button id="nextShiftBtn" disabled onclick="transferShift()">↻ ЗАВЕРШИТИ ТА ЗДАТИ ЗМІНУ</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    let currentShiftNum = [1,2,3, 7,8,9, 13,14,15, 19,20,21, 25,26,27, 31].includes(new Date().getDate()) ? 1 : 2;
    let logs = {};
    let hiddenAlerts = new Set();

    const scheduleData = (names) => [
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]}
    ];

    function setShift(num) {
        currentShiftNum = parseInt(num);
        document.getElementById('groupSelect').value = currentShiftNum;
        updatePersonnelDisplay();
        build();
    }

    function updatePersonnelDisplay() {
        const names = currentShiftNum === 1 ? s1 : s2;
        const display = document.getElementById('personnel-display');
        display.innerHTML = names.map(n => `<span class="person-tag">${n}</span>`).join('');
    }

    function build() {
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const now = new Date();
        document.getElementById('current-date').innerText = now.toLocaleDateString('uk-UA');
        
        tbody.innerHTML = '';
        const schedule = scheduleData(names);

        schedule.forEach((r, i) => {
            const tr = tbody.insertRow();
            const [sH, sM] = r.t.split(':').map(Number);
            let sDate = new Date(); sDate.setHours(sH, sM, 0, 0);
            
            // Логіка переходу доби
            if (now.getHours() < 8 && sH >= 8) sDate.setDate(sDate.getDate() - 1);
            else if (now.getHours() >= 8 && sH < 8) sDate.setDate(sDate.getDate() + 1);
            
            const diff = (now - sDate) / 60000;
            const isAct = diff >= 0 && diff <= 60; // Активний 60 хв від початку
            if (isAct) tr.className = 'active-row';

            let checkContent = '';
            if (r.task === 'walk') {
                if (logs[i]) checkContent = `<span class="log-time">✓ ${logs[i]}</span>`;
                else if (diff > 60) checkContent = '<span class="expired-text">Пропущено</span>';
                else if (diff < 0) checkContent = '<small style="color:#ccc">---</small>';
                else checkContent = `<input type="checkbox" style="width:22px;height:22px;" onchange="mark(${i})">`;
            } else {
                checkContent = '<small style="color:#aaa;">—</small>';
            }

            // Форматування колонки "На посту" - кожне ім'я з нового рядка
            const postDisplay = r.post.map(p => `<span class="post-names">${p}</span>`).join('');

            tr.innerHTML = `
                <td><strong>${r.t}</strong></td>
                <td><span class="badge ${r.task}">${r.task==='walk'?'Обхід':'Сон'}</span></td>
                <td class="${isAct ? 'active-executor' : ''}">${r.exec}</td>
                <td>${postDisplay}</td>
                <td style="text-align:center;">${checkContent}</td>
            `;
        });
        updateStatus();
    }

    function checkAlerts() {
        const now = new Date();
        const curTimeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        const container = document.getElementById('alert-container');
        let html = '';

        if (["20:15", "06:45"].includes(curTimeStr) && !hiddenAlerts.has('grp_'+curTimeStr)) {
            html += `<div class="alert-box blue"><span class="alert-text">📱 ЧАС ВІДМІТКИ У ГРУПІ!</span><button onclick="closeAlert('grp_${curTimeStr}')" style="margin-left:10px;cursor:pointer">OK</button></div>`;
        }
        container.innerHTML = html;
    }

    function closeAlert(id) { hiddenAlerts.add(id); checkAlerts(); }
    function mark(id) { logs[id] = new Date().toLocaleTimeString('uk-UA').slice(0,5); build(); }
    
    function updateStatus() {
        const schedule = scheduleData(s1);
        const walkTasks = schedule.filter(r => r.task === 'walk').length;
        const done = Object.keys(logs).length + document.querySelectorAll('.expired-text').length;
        document.getElementById('nextShiftBtn').disabled = (done < walkTasks);
    }

    function transferShift() {
        if(confirm("Підтвердити здачу чергування?")) {
            logs = {}; hiddenAlerts.clear();
            const nextGrp = currentShiftNum === 1 ? 2 : 1;
            setShift(nextGrp);
            window.scrollTo(0,0);
        }
    }

    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA');
        checkAlerts();
        if (new Date().getSeconds() === 0) build();
    }, 1000);

    setShift(currentShiftNum);
</script>
</body>
</html>
