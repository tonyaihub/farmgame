<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль Смены 24/7 — Система «Часовой»</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: var(--primary); }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--light); padding-bottom: 20px; margin-bottom: 20px; }
        .status-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .status-card { background: var(--dark); color: white; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f8f9fa; padding: 15px; text-align: left; color: var(--primary); border-bottom: 3px solid var(--light); text-transform: uppercase; font-size: 0.85em; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 0.95em; }
        tr:hover { background: #fcfcfc; }
        .active-now { background: #fff9db !important; font-weight: bold; border-left: 5px solid var(--warning); }
        
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .walk { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .sleep { background: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        
        .check-container { text-align: center; width: 120px; }
        .check-box { width: 24px; height: 24px; cursor: pointer; accent-color: var(--success); }
        .log-time { font-size: 0.7em; color: var(--success); display: block; margin-top: 4px; font-family: monospace; }

        .footer { margin-top: 30px; padding: 25px; border-top: 2px solid var(--light); text-align: center; background: #f8f9fa; border-radius: 0 0 15px 15px; }
        #saveBtn { 
            padding: 18px 60px; font-size: 1.1em; border: none; border-radius: 50px; 
            cursor: pointer; transition: 0.4s; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
        }
        #saveBtn:disabled { background: #ccc; color: #999; cursor: not-allowed; box-shadow: none; }
        #saveBtn:enabled { background: var(--success); color: white; box-shadow: 0 5px 15px rgba(39,174,96,0.3); }
        #saveBtn:enabled:hover { background: #219150; transform: translateY(-2px); }

        @media (max-width: 768px) {
            .status-panel { grid-template-columns: 1fr; }
            th:nth-child(4), td:nth-child(4) { display: none; } /* Скрываем колонку "На посту" на мобильных */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2 style="margin:0; color: var(--primary);">Оперативный журнал дежурства</h2>
            <small style="color: #666;">Объектовый контроль 24/7</small>
        </div>
        <div id="clock" style="font-size: 1.4em; font-weight: bold; color: var(--accent); background: var(--light); padding: 5px 15px; border-radius: 8px;">--:--:--</div>
    </div>

    <div class="status-panel">
        <div class="status-card" id="date-info">Дата: --.--.----</div>
        <div class="status-card" id="shift-info" style="background: var(--accent);">Смена: Определение...</div>
        <div class="status-card" id="progress-info">Выполнено: 0%</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Время</th>
                <th>Тип</th>
                <th>Исполнитель</th>
                <th>На посту (Резерв)</th>
                <th style="text-align:center;">Подтверждение</th>
            </tr>
        </thead>
        <tbody id="mainTable">
            </tbody>
    </table>

    <div class="footer">
        <p style="margin-bottom: 15px; color: #666; font-size: 0.9em;">Отчет станет доступен после выполнения всех запланированных обходов и процедур.</p>
        <button id="saveBtn" disabled onclick="generateFinalReport()">Завершить смену и скачать отчет</button>
    </div>
</div>

<script>
    // Составы смен
    const s1 = ["Кузнєцов А.", "Драний О.", "Литовченко С."];
    const s2 = ["Щербатюк О.", "Ікальчик К.", "Приведенюк Р."];
    
    // Хранилище временных меток
    let logs = {};

    // Определение текущей смены по календарю марта 2026
    function getShiftData() {
        const d = new Date().getDate();
        // Смена 1 работает: 1-3, 7-9, 13-15, 19-21, 25-27, 31 марта
        const isS1 = [1,2,3, 7,8,9, 13,14,15, 19,20,21, 25,26,27, 31].includes(d);
        return isS1 ? {id: 1, p: s1} : {id: 2, p: s2};
    }

    function buildTable() {
        const data = getShiftData();
        const names = data.p;
        document.getElementById('shift-info').innerText = "ДЕЖУРНАЯ СМЕНА №" + data.id;
        document.getElementById('date-info').innerText = "Дата: " + new Date().toLocaleDateString();

        // Полный регламент на 24 часа
        const rows = [
            // Дневные обходы (раз в час, 20-40 мин)
            {t: "08:20", task: "walk", exec: names[0], post: names[1]+", "+names[2]},
            {t: "09:20", task: "walk", exec: names[1], post: names[0]+", "+names[2]},
            {t: "10:20", task: "walk", exec: names[2], post: names[0]+", "+names[1]},
            {t: "11:20", task: "walk", exec: names[0], post: names[1]+", "+names[2]},
            {t: "12:20", task: "walk", exec: names[1], post: names[0]+", "+names[2]},
            {t: "13:20", task: "walk", exec: names[2], post: names[0]+", "+names[1]},
            {t: "14:20", task: "walk", exec: names[0], post: names[1]+", "+names[2]},
            {t: "15:20", task: "walk", exec: names[1], post: names[0]+", "+names[2]},
            {t: "16:20", task: "walk", exec: names[2], post: names[0]+", "+names[1]},
            {t: "17:20", task: "walk", exec: names[0], post: names[1]+", "+names[2]},
            // Распределенное "Усиление"
            {t: "18:20", task: "walk", exec: names[1], post: names[0]+", "+names[2]},
            {t: "19:20", task: "walk", exec: names[2], post: names[0]+", "+names[1]},
            // Ночной режим (отдых + обходы раз в 2 часа)
            {t: "20:00", task: "sleep", exec: names[0] + " (ОТДЫХ)", post: names[1]+", "+names[2]},
            {t: "20:20", task: "walk", exec: names[1], post: names[2]},
            {t: "22:20", task: "walk", exec: names[2], post: names[1]},
            {t: "00:00", task: "sleep", exec: names[1] + " (ОТДЫХ)", post: names[0]+", "+names[2]},
            {t: "00:20", task: "walk", exec: names[0], post: names[2]},
            {t: "02:20", task: "walk", exec: names[2], post: names[0]},
            {t: "04:00", task: "sleep", exec: names[2] + " (ОТДЫХ)", post: names[0]+", "+names[1]},
            {t: "04:20", task: "walk", exec: names[0], post: names[1]},
            {t: "06:20", task: "walk", exec: names[1], post: names[0]}
        ];

        const body = document.getElementById('mainTable');
        const currentHour = new Date().getHours();

        rows.forEach((r, i) => {
            const tr = body.insertRow();
            // Подсветка текущего часа
            const rowHour = parseInt(r.t.split(':')[0]);
            if(currentHour === rowHour) tr.className = 'active-now';

            tr.innerHTML = `
                <td><strong style="color:var(--accent)">${r.t}</strong></td>
                <td><span class="badge ${r.task}">${r.task === 'walk' ? 'Обход' : 'Ночь/Сон'}</span></td>
                <td>${r.exec}</td>
                <td style="color: #666;">${r.post}</td>
                <td class="check-container">
                    <input type="checkbox" class="check-box" onchange="markAction(${i}, '${r.t}', '${r.exec}')">
                    <span id="log-${i}" class="log-time"></span>
                </td>
            `;
        });
    }

    function markAction(id, scheduleTime, person) {
        const logSpan = document.getElementById('log-'+id);
        if(!logs[id]) {
            const now = new Date().toLocaleTimeString();
            logs[id] = {time: now, person: person, schedule: scheduleTime};
            logSpan.innerText = "ОК: " + now;
        } else {
            delete logs[id];
            logSpan.innerText = "";
        }
        updateStatus();
    }

    function updateStatus() {
        const total = document.querySelectorAll('.check-box').length;
        const checked = Object.keys(logs).length;
        const percent = Math.round((checked / total) * 100);
        
        document.getElementById('progress-info').innerText = "Выполнено: " + percent + "%";
        document.getElementById('saveBtn').disabled = (checked !== total);
    }

    function generateFinalReport() {
        const shift = getShiftData();
        let reportText = `==========================================\n`;
        reportText += `   ИТОГОВЫЙ ОТЧЕТ ПО ОБЪЕКТУ (24/7)\n`;
        reportText += `==========================================\n\n`;
        reportText += `Дата: ${new Date().toLocaleDateString()}\n`;
        reportText += `Смена №: ${shift.id}\n`;
        reportText += `Состав: ${shift.p.join(', ')}\n`;
        reportText += `Статус: Пост сдан без замечаний\n\n`;
        reportText += `ХРОНОЛОГИЯ ПОДТВЕРЖДЕНИЙ ОБХОДОВ:\n`;
        reportText += `------------------------------------------\n`;
        
        Object.keys(logs).sort((a,b) => a-b).forEach(key => {
            const item = logs[key];
            reportText += `[${item.schedule}] - Исполнитель: ${item.person.padEnd(20)} | Отметка в: ${item.time}\n`;
        });

        reportText += `\n------------------------------------------\n`;
        reportText += `Отчет сформирован автоматически в ${new Date().toLocaleTimeString()}\n`;

        // Скачивание файла
        const blob = new Blob([reportText], {type: "text/plain;charset=utf-8"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Otchet_Smena_${shift.id}_${new Date().toLocaleDateString().replace(/\./g, '-')}.txt`;
        link.click();
    }

    // Часы реального времени
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    // Запуск при загрузке
    window.onload = buildTable;
</script>

</body>
</html>
