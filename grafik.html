<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік чергування (Оновлений дизайн)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --active-bg: #fff9db;
            --grad: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: var(--primary); transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }
        
        /* НОВА ШАПКА */
        .header { 
            display: grid; 
            grid-template-columns: 1fr auto; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 2px solid var(--light); 
            padding-bottom: 15px; 
        }
        .header-title h1 { margin: 0; font-size: 3em; color: var(--primary); font-weight: 800; letter-spacing: -1px; }
        
        .time-area { text-align: center; justify-self: end; }
        #current-date { display: block; font-size: 1.1em; color: var(--dark); font-weight: bold; margin-bottom: -5px; }
        #clock { font-size: 2.5em; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

        /* ПАНЕЛЬ УПРАВЛІННЯ */
        .top-controls { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
        
        /* СТИЛІЗОВАНА КНОПКА ВИБОРУ ЗМІНИ */
        .shift-selector-wrapper { position: relative; width: 100%; }
        .group-selector {
            width: 100%; padding: 18px; 
            border: none; border-radius: 12px;
            background: var(--grad); color: white; 
            font-size: 1.3em; font-weight: 800;
            cursor: pointer; text-align: center; text-transform: uppercase; 
            outline: none; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            appearance: none; -webkit-appearance: none;
        }
        .group-selector:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(52, 152, 219, 0.4); }
        .group-selector option { background: white; color: var(--dark); font-weight: normal; font-size: 0.9em; }

        .personnel-display { 
            background: #f8f9fa; border: 1px solid #ddd; border-radius: 10px; padding: 15px;
            display: flex; justify-content: space-around; font-weight: bold; font-size: 1.2em;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }

        /* ТАБЛИЦЯ */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; padding: 12px 15px; text-align: left; border-bottom: 3px solid var(--dee2e6); font-size: 0.9em; color: #666; text-transform: uppercase; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; vertical-align: top; transition: 0.3s; }

        .current-task-row { background-color: var(--active-bg) !important; border-left: 10px solid var(--warning) !important; font-weight: bold; }
        body.dim-past .past-task-row { opacity: 0.35; filter: grayscale(80%); }

        /* МОДАЛЬНЕ ВІКНО */
        #historyModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content { background: white; width: 95%; max-width: 800px; padding: 25px; border-radius: 15px; max-height: 85vh; overflow-y: auto; }
        
        /* КНОПКИ */
        .footer { margin-top: 25px; display: flex; gap: 15px; align-items: center; }
        .btn { padding: 16px 30px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 1em; }
        .btn-success { background: var(--success); color: white; flex-grow: 1; box-shadow: 0 5px 15px rgba(39, 174, 96, 0.2); }
        .btn-success:hover { background: #219150; transform: translateY(-2px); }
        .btn-info { background: var(--dark); color: white; }
        .btn-excel { background: #1D6F42; color: white; }
        
        .btn:disabled { background: #ccc !important; cursor: not-allowed; opacity: 0.7; transform: none !important; box-shadow: none !important; }
    </style>
</head>
<body class="dim-past">

<div class="container">
    <div class="header">
        <div class="header-title">
            <h1>Графік</h1>
            <small style="color: #7f8c8d; font-size: 1em;">Контроль чергової зміни</small>
        </div>
        <div class="time-area">
            <span id="current-date">--.--.----</span>
            <div id="clock">00:00:00</div>
        </div>
    </div>

    <div class="top-controls">
        <div class="shift-selector-wrapper">
            <select id="groupSelect" class="group-selector" onchange="changeShift(this.value)">
                <option value="1">Активна: Зміна №1</option>
                <option value="2">Активна: Зміна №2</option>
            </select>
        </div>
        <div class="personnel-display" id="names-box"></div>
    </div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>План</th>
                <th>Виконавець</th>
                <th>На посту</th>
                <th style="text-align:center;">Звіт</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="footer">
        <button class="btn btn-info" onclick="showHistory()">📜 Архів</button>
        <button id="nextShiftBtn" class="btn btn-success" disabled onclick="transferShift()">↻ Здати чергування</button>
    </div>
</div>

<div id="historyModal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0;">📜 Архів змін</h2>
            <button class="btn btn-excel" onclick="downloadExcel()">⬇ Excel (.xlsx)</button>
        </div>
        <div id="historyList"></div>
        <button class="btn" style="background:#eee; width:100%; margin-top:15px;" onclick="closeHistory()">Закрити</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    
    let logs = JSON.parse(localStorage.getItem('duty_logs')) || {};
    let shiftHistory = JSON.parse(localStorage.getItem('shift_history')) || [];
    let currentShiftNum = parseInt(localStorage.getItem('active_shift')) || 1;
    let lastActiveTask = null;

    const scheduleData = (names) => [
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]}
    ];

    function changeShift(num) {
        currentShiftNum = parseInt(num);
        localStorage.setItem('active_shift', currentShiftNum);
        render();
    }

    function render() {
        const now = new Date();
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const schedule = scheduleData(names);
        
        document.getElementById('current-date').innerText = now.toLocaleDateString('uk-UA');
        document.getElementById('names-box').innerHTML = names.map(n => `<span>${n}</span>`).join('');
        document.getElementById('groupSelect').value = currentShiftNum;

        tbody.innerHTML = '';
        let currentIdx = -1;

        schedule.forEach((row, index) => {
            const tr = tbody.insertRow();
            const [h, m] = row.t.split(':').map(Number);
            let tT = new Date(); tT.setHours(h, m, 0, 0);
            if (now.getHours() < 8 && h >= 8) tT.setDate(tT.getDate() - 1);
            else if (now.getHours() >= 8 && h < 8) tT.setDate(tT.getDate() + 1);
            
            const diffMin = (now - tT) / 60000;
            if (diffMin >= 0 && diffMin < 60) { tr.className = 'current-task-row'; currentIdx = index; }
            else if (diffMin >= 60) tr.className = 'past-task-row';

            let checkHtml = row.task === 'walk' ? 
                (logs[index] ? `<b style="color:var(--success)">✓ ${logs[index]}</b>` : 
                (diffMin > 60 ? `<small style="color:var(--danger)">ПРОПУЩЕНО</small>` : 
                (diffMin < 0 ? `---` : `
