<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Screen Schedule</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ecf0f1;
            --accent: #3498db;
            --active-bg: #4d4520;
            --border: #3d3d3d;
            --warning: #f1c40f;
        }

        /* Налаштування для заповнення всього екрана */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Прибираємо зайву прокрутку */
            background-color: var(--bg-color);
            font-family: 'Segoe UI', sans-serif;
            color: var(--text-color);
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh; /* 100% висоти пристрою */
            width: 100vw;  /* 100% ширини пристрою */
            padding: 1vh;
        }

        /* Масштабований заголовок */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 10vh;
            padding: 0 2vw;
            background: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 0.5vh;
        }

        .header h1 {
            margin: 0;
            font-size: 4vh; /* Розмір залежить від висоти екрана */
            text-transform: uppercase;
        }

        .status-box {
            background: rgba(0,0,0,0.3);
            padding: 0.5vh 2vw;
            border-radius: 5px;
            text-align: center;
        }

        .status-box span {
            display: block;
            font-size: 1.5vh;
            color: #7f8c8d;
        }

        .status-box b {
            font-size: 2.5vh;
            color: var(--accent);
            font-family: monospace;
        }

        /* Контейнер таблиці, що тягнеться */
        .table-container {
            flex-grow: 1;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            height: 4vh;
            background: #222;
            font-size: 1.6vh;
            text-transform: uppercase;
            color: #95a5a6;
            border-bottom: 2px solid var(--accent);
        }

        td {
            border-bottom: 1px solid var(--border);
            padding: 0.5vh 1vw;
            vertical-align: middle;
            font-size: 1.8vh; /* Автомасштаб тексту */
        }

        /* Стилі рядків */
        .active-row {
            background-color: var(--active-bg);
            border-left: 5px solid var(--warning);
        }

        .past-row {
            opacity: 0.4;
            filter: grayscale(80%);
        }

        /* Видалення ком: прізвища списком */
        .names-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .names-list li {
            margin-bottom: 2px;
        }

        .time-col { width: 20%; font-weight: bold; color: var(--accent); }
        .task-col { width: 30%; }
        .post-col { width: 35%; }
        .check-col { width: 15%; text-align: center; }

        input[type="checkbox"] {
            transform: scale(1.5); /* Збільшуємо чекбокс для зручності */
        }

        /* Кнопка внизу */
        .footer-btn {
            height: 8vh;
            margin-top: 0.5vh;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 2.5vh;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="header">
        <div>
            <h1>ГРАФІК</h1>
            <small style="font-size: 1.5vh;">09.03.2026</small>
        </div>
        <div class="status-box">
            <span>ОБХІД ЧЕРЕЗ</span>
            <b>00:17:21</b>
        </div>
        <div style="text-align: right;">
            <b style="font-size: 3vh; display: block;">08:02</b>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="time-col">План</th>
                    <th class="task-col">Завдання</th>
                    <th class="post-col">Пост</th>
                    <th class="check-col">Звіт</th>
                </tr>
            </thead>
            <tbody>
                <tr class="active-row">
                    <td class="time-col">08:00-08:20</td>
                    <td>Зміна чергових</td>
                    <td>
                        <ul class="names-list">
                            <li>Кузнєцов</li>
                            <li>Драний</li>
                            <li>Литовченко</li>
                        </ul>
                    </td>
                    <td class="check-col"><input type="checkbox" checked></td>
                </tr>
                <tr>
                    <td class="time-col">08:20</td>
                    <td>Кузнєцов</td>
                    <td>
                        <ul class="names-list">
                            <li>Драний</li>
                            <li>Литовченко</li>
                        </ul>
                    </td>
                    <td class="check-col"><input type="checkbox"></td>
                </tr>
                <tr>
                    <td class="time-col">09:20</td>
                    <td>Драний</td>
                    <td>
                        <ul class="names-list">
                            <li>Кузнєцов</li>
                            <li>Литовченко</li>
                        </ul>
                    </td>
                    <td class="check-col"><input type="checkbox"></td>
                </tr>
                <tr>
                    <td class="time-col">10:20</td>
                    <td>Литовченко</td>
                    <td>
                        <ul class="names-list">
                            <li>Кузнєцов</li>
                            <li>Драний</li>
                        </ul>
                    </td>
                    <td class="check-col"><input type="checkbox"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="footer-btn">Наступна зміна</button>
</div>

<script>
    // Скріпт для автоматичного масштабування, якщо тексту забагато
    function adjustScale() {
        const table = document.querySelector('table');
        const container = document.querySelector('.table-container');
        if (table.scrollHeight > container.clientHeight) {
            // Якщо таблиця не влазить, трохи зменшуємо шрифт
            document.body.style.fontSize = '1.5vh';
        }
    }
    window.onload = adjustScale;
    window.onresize = adjustScale;
</script>

</body>
</html>
