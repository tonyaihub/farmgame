<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік чергування</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f39c12; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --active-bg: #fff9db;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: var(--primary); }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 2px solid var(--light); padding-bottom: 10px; }
        .date-area { font-size: 1.1em; font-weight: bold; color: var(--dark); }
        #clock { font-size: 1.8em; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

        .top-controls { display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px; margin-bottom: 20px; align-items: center; }
        
        .shift-btn-container { position: relative; }
        .group-selector {
            width: 100%; padding: 15px; border: 2px solid var(--accent); border-radius: 10px;
            background: var(--accent); color: white; font-size: 1.2em; font-weight: 800;
            cursor: pointer; text-align: center; transition: 0.3s; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
            text-transform: uppercase; letter-spacing: 1px; outline: none;
        }
        .group-selector:hover { background: #2980b9; }

        .personnel-display { 
            background: #f8f9fa; border: 1px solid #ddd; border-radius: 10px; padding: 12px;
            display: flex; justify-content: space-around; font-weight: bold; font-size: 1.1em;
        }

        .alert-area { margin-bottom: 15px; }
        .alert-toast { 
            background: var(--danger); color: white; padding: 15px; border-radius: 8px; 
            text-align: center; font-weight: bold; margin-bottom: 10px; animation: slideIn 0.3s ease;
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; font-size: 0.9em; color: #666; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; }

        .current-task-row { 
            background-color: var(--active-bg) !important;
            outline: 3px solid var(--warning);
            position: relative; z-index: 1;
        }
        .current-task-row td:first-child { border-left: 8px solid var(--warning); }

        .post-item { display: block; margin-bottom: 3px; }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 0.75em; font-weight: bold; }
        .walk { background: #d1ecf1; color: #0c5460; }
        .sleep { background: #e2e3e5; color: #383d41; }

        .footer { margin-top: 20px; text-align: center; }
        #nextShiftBtn { 
            padding: 15px 50px; border-radius: 30px; border: none; font-weight: bold; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        #nextShiftBtn:disabled { background: #ddd; color: #999; }
        #nextShiftBtn:enabled { background: var(--success); color: white; }

        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="date-area">
            <div>Графік чергування</div>
            <div id="current-date">--.--.----</div>
        </div>
        <div id="clock">00:00:00</div>
    </div>

    <div class="top-controls">
        <div class="shift-btn-container">
            <select id="groupSelect" class="group-selector" onchange="changeShift(this.value)">
                <option value="1">Зміна №1 (Активна)</option>
                <option value="2">Зміна №2 (Активна)</option>
            </select>
        </div>
        <div class="personnel-display" id="names-box"></div>
    </div>

    <div id="alert-area" class="alert-area"></div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>План</th>
                <th>Тип</th>
                <th>Виконавець</th>
                <th>На посту</th>
                <th style="text-align:center;">Звіт</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="footer">
        <button id="nextShiftBtn" disabled onclick="transferShift()">Здати чергування</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    let currentShiftNum = [1,2,3, 7,8,9, 13,14,15, 19,20,21, 25,26,27, 31].includes(new Date().getDate()) ? 1 : 2;
    let logs = {};
    let activeAlerts = new Set();
    let lastActiveTask = null;

    const scheduleData = (names) => [
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]}
    ];

    // Функція генерації звуку
    function playSound(type = 'beep') {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = type === 'alert' ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(type === 'alert' ? 440 : 880, ctx.currentTime);
        
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
    }

    function changeShift(num) {
        currentShiftNum = parseInt(num);
        render();
    }

    function render() {
        const now = new Date();
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const schedule = scheduleData(names);
        
        document.getElementById('current-date').innerText = now.toLocaleDateString('uk-UA');
        document.getElementById('names-box').innerHTML = names.map(n => `<span>${n}</span>`).join('');
        document.getElementById('groupSelect').value = currentShiftNum;

        tbody.innerHTML = '';
        let currentTaskId = null;

        schedule.forEach((row, index) => {
            const tr = tbody.insertRow();
            const [h, m] = row.t.split(':').map(Number);
            let taskTime = new Date();
            taskTime.setHours(h, m, 0, 0);
            
            if (now.getHours() < 8 && h >= 8) taskTime.setDate(taskTime.getDate() - 1);
            else if (now.getHours() >= 8 && h < 8) taskTime.setDate(taskTime.getDate() + 1);
            
            const diffMin = (now - taskTime) / 60000;
            const isCurrent = diffMin >= 0 && diffMin < 60;

            if (isCurrent) {
                tr.className = 'current-task-row';
                currentTaskId = index;
            }

            let checkHtml = '';
            if (row.task === 'walk') {
                if (logs[index]) checkHtml = `<b style="color:var(--success)">✓ ${logs[index]}</b>`;
                else if (diffMin > 60) checkHtml = `<span style="color:var(--danger); font-size:0.8em">ПРОПУЩЕНО</span>`;
                else if (diffMin < 0) checkHtml = `<span style="color:#ccc">---</span>`;
                else checkHtml = `<input type="checkbox" style="transform:scale(1.5); cursor:pointer" onchange="mark(${index})">`;
            } else {
                checkHtml = `<small style="color:#aaa">сон</small>`;
            }

            tr.innerHTML = `
                <td>${row.t}</td>
                <td><span class="badge ${row.task}">${row.task === 'walk' ? 'ОБХІД' : 'СОН'}</span></td>
                <td>${row.exec}</td>
                <td>${row.post.map(p => `<span class="post-item">${p}</span>`).join('')}</td>
                <td style="text-align:center">${checkHtml}</td>
            `;
        });

        // Перевірка на зміну активного ряду для звуку
        if (currentTaskId !== null && currentTaskId !== lastActiveTask) {
            if (lastActiveTask !== null) playSound('beep');
            lastActiveTask = currentTaskId;
        }

        checkSystemAlerts(now);
        updateBtn();
    }

    function checkSystemAlerts(now) {
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        const alertArea = document.getElementById('alert-area');
        
        // Час для відмітки в Телеграм/Рацію
        if (["20:15", "06:45"].includes(timeStr) && !activeAlerts.has(timeStr)) {
            alertArea.innerHTML = `<div class="alert-toast">📱 ЧАС ВІДМІТКИ В ГРУПІ (${timeStr})</div>`;
            playSound('alert');
            activeAlerts.add(timeStr);
            setTimeout(() => { alertArea.innerHTML = ''; }, 60000);
        }
    }

    function mark(id) {
        logs[id] = new Date().toLocaleTimeString('uk-UA').slice(0, 5);
        render();
    }

    function updateBtn() {
        const walkCount = scheduleData(s1).filter(r => r.task === 'walk').length;
        const loggedCount = Object.keys(logs).length;
        document.getElementById('nextShiftBtn').disabled = loggedCount < walkCount;
    }

    function transferShift() {
        if(confirm("Здати чергування?")) {
            logs = {};
            activeAlerts.clear();
            currentShiftNum = currentShiftNum === 1 ? 2 : 1;
            render();
        }
    }

    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = d.toLocaleTimeString('uk-UA');
        if (d.getSeconds() === 0) render();
    }, 1000);

    render();
</script>
</body>
</html>
