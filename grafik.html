<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Графік Чергування PRO</title>
    <style>
        :root {
            --bg: #1a1a1a; --card: #2d2d2d; --text: #ecf0f1;
            --accent: #3498db; --active-bg: #4d4520; --border: #3d3d3d;
            --warning: #f1c40f; --success: #27ae60; --sleep: #a29bfe;
        }

        /* Светлая тема */
        body.light-theme {
            --bg: #f0f2f5; --card: #ffffff; --text: #2c3e50;
            --border: #dcdde1; --active-bg: #f1f2b5; --accent: #2980b9;
        }

        html, body { height: 100%; margin: 0; padding: 0; background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: var(--text); overflow: hidden; transition: background 0.3s; }
        .main-container { display: flex; flex-direction: column; height: 100vh; padding: 10px; box-sizing: border-box; }

        /* Шапка: Лево, Центр, Право */
        .header { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr 1fr; 
            align-items: center; 
            background: var(--card); 
            padding: 10px; 
            border-radius: 12px; 
            margin-bottom: 8px; 
            border: 1px solid var(--border); 
            flex-shrink: 0; 
        }

        .header-left h1 { margin: 0; font-size: 16px; text-transform: uppercase; }
        .header-left small { opacity: 0.6; font-size: 11px; }

        .header-center { text-align: center; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
        #clock-display { font-weight: bold; color: var(--accent); font-size: 22px; display: block; line-height: 1; }
        #timer-display { font-size: 11px; color: var(--warning); margin-top: 4px; font-family: monospace; }

        .header-right { display: flex; justify-content: flex-end; gap: 8px; }
        
        /* Кнопки в шапке */
        .tool-btn {
            width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .tool-btn.active { background: var(--warning); color: black; border-color: var(--warning); }

        /* Таблица */
        .table-area { flex-grow: 1; background: var(--card); border-radius: 12px; overflow-y: auto; border: 1px solid var(--border); margin-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { position: sticky; top: 0; background: var(--card); z-index: 10; padding: 10px 5px; font-size: 10px; text-transform: uppercase; color: #7f8c8d; border-bottom: 2px solid var(--accent); text-align: left; }
        td { padding: 8px 5px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }

        .active-row { background: var(--active-bg); border-left: 4px solid var(--warning); font-weight: bold; }
        
        /* Эффект лампочки (прозрачность прошлых строк) */
        body.lamp-off .past-task-row { opacity: 0.35; filter: grayscale(0.5); }
        
        select { background: var(--bg); color: var(--text); border: 1px solid var(--accent); border-radius: 4px; padding: 4px; width: 100%; font-size: 13px; outline: none; }
        
        .col-plan { width: 22%; }
        .col-task { width: 35%; }
        .col-post { width: 30%; }
        .col-zvit { width: 13%; text-align: center; }

        .archive-section { background: rgba(0,0,0,0.1); padding: 10px; border-radius: 8px; margin: 10px; border: 1px solid var(--border); }
        .archive-item { font-size: 12px; border-bottom: 1px solid var(--border); padding: 5px 0; display: flex; justify-content: space-between; }

        .next-btn { width: 100%; height: 50px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; flex-shrink: 0; }
        .next-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
        
        .label-obkhid { font-size: 9px; color: var(--accent); display: block; }
        .label-sleep { font-size: 9px; color: var(--sleep); display: block; }
        input[type="checkbox"] { transform: scale(1.4); accent-color: var(--success); }
    </style>
</head>
<body class="lamp-on"> <div class="main-container">
    <div class="header">
        <div class="header-left">
            <h1>Зміна №1</h1>
            <small id="date-display">--.--.----</small>
        </div>
        
        <div class="header-center">
            <span id="clock-display">00:00:00</span>
            <div id="timer-display">ОБХІД ЧЕРЕЗ: 00:00:00</div>
        </div>

        <div class="header-right">
            <button class="tool-btn" onclick="toggleTheme()" title="Змінити тему">🌓</button>
            <button class="tool-btn active" id="lamp-btn" onclick="toggleLamp()" title="Ефект минулого">💡</button>
        </div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th class="col-plan">План</th>
                    <th class="col-task">Дія / Хто</th>
                    <th class="col-post">На посту</th>
                    <th class="col-zvit">Звіт</th>
                </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
        </table>

        <div class="archive-section">
            <h3 style="font-size: 13px; margin: 0 0 8px 0;">📜 Архів останніх змін</h3>
            <div id="archive-list"></div>
        </div>
    </div>

    <button id="shift-btn" class="next-btn" onclick="saveToArchive()" disabled>Здати зміну</button>
</div>

<script>
    const members = ["Кузнєцов", "Драний", "Литовченко"];
    let logs = JSON.parse(localStorage.getItem('logs_v6')) || {};
    let selections = JSON.parse(localStorage.getItem('select_v6')) || {};
    let archive = JSON.parse(localStorage.getItem('archive_v6')) || [];

    const scheduleData = [
        {t: "08:00", h: 8, m: 0, d: 20, type: "Зміна", task: "Зміна чергових", fixedPost: "Всі"},
        {t: "08:20", h: 8, m: 20, d: 60, type: "Обхід"},
        {t: "09:20", h: 9, m: 20, d: 60, type: "Обхід"},
        {t: "10:20", h: 10, m: 20, d: 60, type: "Обхід"},
        {t: "11:20", h: 11, m: 20, d: 60, type: "Обхід"},
        {t: "12:20", h: 12, m: 20, d: 60, type: "Обхід"},
        {t: "13:20", h: 13, m: 20, d: 60, type: "Обхід"},
        {t: "14:20", h: 14, m: 20, d: 60, type: "Обхід"},
        {t: "15:20", h: 15, m: 20, d: 60, type: "Обхід"},
        {t: "16:20", h: 16, m: 20, d: 60, type: "Обхід"},
        {t: "17:20", h: 17, m: 20, d: 60, type: "Обхід"},
        {t: "18:20", h: 18, m: 20, d: 60, type: "Обхід"},
        {t: "19:20", h: 19, m: 20, d: 60, type: "Обхід"},
        {t: "20:00", h: 20, m: 0, d: 120, type: "Сон"},
        {t: "20:20", h: 20, m: 20, d: 120, type: "Обхід"},
        {t: "22:20", h: 22, m: 20, d: 100, type: "Обхід"},
        {t: "00:00", h: 0, m: 0, d: 120, type: "Сон"},
        {t: "00:20", h: 0, m: 20, d: 120, type: "Обхід"},
        {t: "02:20", h: 2, m: 20, d: 100, type: "Обхід"},
        {t: "04:00", h: 4, m: 0, d: 120, type: "Сон"},
        {t: "04:20", h: 4, m: 20, d: 120, type: "Обхід"},
        {t: "06:20", h: 6, m: 20, d: 25, type: "Обхід"},
        {t: "06:45", h: 6, m: 45, d: 75, type: "Підготовка", task: "Підготовка", fixedPost: "Всі"}
    ];

    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    function toggleLamp() { 
        document.body.classList.toggle('lamp-off');
        document.getElementById('lamp-btn').classList.toggle('active');
    }

    function render() {
        const now = new Date();
        document.getElementById('clock-display').innerText = now.toLocaleTimeString('uk-UA');
        
        let shiftStart = new Date(now);
        if (now.getHours() < 8) shiftStart.setDate(shiftStart.getDate() - 1);
        shiftStart.setHours(8, 0, 0, 0);
        document.getElementById('date-display').innerText = shiftStart.toLocaleDateString('uk-UA');

        const tbody = document.getElementById('schedule-body');
        tbody.innerHTML = '';
        let nextWalk = null;

        scheduleData.forEach((row, idx) => {
            const tr = document.createElement('tr');
            const tStart = new Date(shiftStart);
            tStart.setHours(row.h, row.m, 0, 0);
            if (row.h < 8) tStart.setDate(tStart.getDate() + 1);
            const tEnd = new Date(tStart.getTime() + row.d * 60000);

            const isActive = now >= tStart && now < tEnd;
            if (now >= tEnd) tr.className = 'past-task-row';
            if (isActive) tr.className = 'active-row';
            if (tStart > now && !nextWalk) nextWalk = tStart;

            let taskCell = "";
            let postCell = "";

            if (row.type === "Обхід" || row.type === "Сон") {
                const selected = selections[idx] || members[idx % 3];
                const others = members.filter(m => m !== selected);
                const labelClass = row.type === "Обхід" ? "label-obkhid" : "label-sleep";

                taskCell = `<span class="${labelClass}">${row.type}</span>
                    <select onchange="updateSelect(${idx}, this.value)" ${!isActive ? 'disabled' : ''}>
                        ${members.map(m => `<option value="${m}" ${m === selected ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>`;
                postCell = others.join('<br>');
            } else {
                taskCell = `<span style="color:var(--accent)">${row.task}</span>`;
                postCell = row.fixedPost;
            }

            tr.innerHTML = `
                <td class="col-plan">${row.t}</td>
                <td class="col-task">${taskCell}</td>
                <td class="col-post">${postCell}</td>
                <td class="col-zvit"><input type="checkbox" ${logs[idx]?'checked':''} ${!isActive?'disabled':''} onchange="saveLog(${idx})"></td>
            `;
            tbody.appendChild(tr);
        });

        if (nextWalk) {
            let diff = new Date(nextWalk - now).toISOString().substr(11, 8);
            document.getElementById('timer-display').innerText = "ОБХІД ЧЕРЕЗ: " + diff;
        }
        
        const btn = document.getElementById('shift-btn');
        const endShift = new Date(shiftStart); endShift.setDate(endShift.getDate()+1); endShift.setHours(8,0,0,0);
        btn.disabled = now < endShift;
        
        renderArchive();
    }

    function updateSelect(id, val) { selections[id] = val; localStorage.setItem('select_v6', JSON.stringify(selections)); render(); }
    function saveLog(id) { logs[id] = !logs[id]; localStorage.setItem('logs_v6', JSON.stringify(logs)); render(); }

    function saveToArchive() {
        const dateStr = document.getElementById('date-display').innerText;
        const totalWalks = Object.values(logs).filter(v => v).length;
        archive.unshift({ date: dateStr, walks: totalWalks });
        localStorage.setItem('archive_v6', JSON.stringify(archive.slice(0, 10)));
        logs = {}; selections = {};
        localStorage.removeItem('logs_v6'); localStorage.removeItem('select_v6');
        alert("Зміну здано та збережено!");
        render();
    }

    function renderArchive() {
        const list = document.getElementById('archive-list');
        list.innerHTML = archive.map(a => `<div class="archive-item"><span>📅 ${a.date}</span><span>Обходів: <b>${a.walks}</b></span></div>`).join('') || "Порожньо";
    }

    setInterval(render, 1000);
    render();
</script>
</body>
</html>
