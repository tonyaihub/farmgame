<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Графік чергування — Мобільна версія</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --active-bg: #fff9db; --body-bg: #f0f2f5; --card-bg: white; --text: #2c3e50;
            --grad: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        body.dark-theme {
            --body-bg: #1a1a1a; --card-bg: #2d2d2d; --text: #ecf0f1;
            --light: #3d3d3d; --active-bg: #4d4520;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--body-bg); margin: 0; padding: 5px; color: var(--text); transition: 0.3s; overflow-x: hidden; }
        
        .container { max-width: 1000px; margin: auto; background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        
        /* АДАПТИВНА ШАПКА */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--light); padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-title h1 { margin: 0; font-size: 1.8em; font-weight: 800; line-height: 1; }
        .header-title small { font-size: 0.8em; color: #7f8c8d; font-weight: bold; }
        
        .time-area { text-align: center; flex-grow: 1; }
        #clock { font-size: 1.8em; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
        #current-date { font-size: 0.9em; font-weight: bold; display: block; }

        .top-right-tool { display: flex; gap: 5px; }
        .tool-btn { background: var(--light); width: 40px; height: 40px; border-radius: 8px; font-size: 18px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; color: var(--text); }
        .tool-btn.active { background: var(--warning); }

        /* СЕЛЕКТОР ТА ПРІЗВИЩА */
        .top-controls { margin-bottom: 15px; }
        .group-selector { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--grad); color: white; font-size: 1.1em; font-weight: 800; text-align: center; appearance: none; margin-bottom: 8px; }
        .personnel-display { background: var(--light); border-radius: 8px; padding: 8px; display: flex; justify-content: space-around; font-weight: bold; font-size: 0.85em; flex-wrap: wrap; gap: 5px; }

        /* ТАБЛИЦЯ (АДАПТИВНІСТЬ) */
        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 320px; }
        th { background: var(--light); padding: 8px 5px; text-align: left; border-bottom: 2px solid var(--accent); font-size: 0.75em; text-transform: uppercase; }
        td { padding: 10px 5px; border-bottom: 1px solid var(--light); vertical-align: middle; font-size: 0.85em; }

        .current-task-row { animation: pulse 2s infinite; border-left: 5px solid var(--warning) !important; background-color: var(--active-bg); }
        body.dim-past .past-task-row { opacity: 0.4; filter: grayscale(50%); }

        /* КНОПКА ТА СТАТУС */
        .footer { margin-top: 15px; text-align: center; }
        .btn { padding: 15px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 1em; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:disabled { background: #ccc !important; opacity: 0.6; }
        .status-msg { font-size: 0.8em; margin-bottom: 8px; font-weight: bold; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        /* Мобільні виправлення для дуже малих екранів */
        @media (max-width: 380px) {
            .header-title h1 { font-size: 1.4em; }
            #clock { font-size: 1.5em; }
            td, th { font-size: 0.75em; padding: 8px 3px; }
        }
    </style>
</head>
<body class="dim-past">

<div class="container">
    <div class="header">
        <div class="header-title"><h1>Графік</h1><small>чергувань</small></div>
        <div class="time-area">
            <span id="current-date">--.--.----</span>
            <div id="clock">00:00:00</div>
        </div>
        <div class="top-right-tool">
            <button class="tool-btn" onclick="toggleTheme()">🌓</button>
            <button class="tool-btn active" id="lightBtn" onclick="toggleDimming()">💡</button>
        </div>
    </div>

    <div class="top-controls">
        <select id="groupSelect" class="group-selector" onchange="changeShift(this.value)">
            <option value="1">Зміна №1</option>
            <option value="2">Зміна №2</option>
        </select>
        <div class="personnel-display" id="names-box"></div>
    </div>

    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
                <tr>
                    <th style="width: 15%;">План</th>
                    <th style="width: 30%;">Хто</th>
                    <th style="width: 35%;">Пост</th>
                    <th style="width: 20%; text-align:center;">Звіт</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer">
        <div id="statusMessage" class="status-msg"></div>
        <button id="nextShiftBtn" class="btn btn-success" disabled onclick="transferShift()">↻ Наступна зміна</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    let logs = JSON.parse(localStorage.getItem('duty_logs')) || {};
    let currentShiftNum = parseInt(localStorage.getItem('active_shift')) || 1;
    let lastNotifiedIdx = null;

    if(localStorage.getItem('dark_theme') === 'true') document.body.classList.add('dark-theme');
    if (Notification.permission !== 'granted') Notification.requestPermission();

    const scheduleData = (names) => [
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]}
    ];

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-theme');
        localStorage.setItem('dark_theme', isDark);
    }

    function toggleDimming() {
        document.body.classList.toggle('dim-past');
        document.getElementById('lightBtn').classList.toggle('active');
    }

    function render() {
        const now = new Date();
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const schedule = scheduleData(names);

        let shiftStart = new Date(now);
        shiftStart.setHours(8, 0, 0, 0);
        if (now.getHours() < 8) shiftStart.setDate(shiftStart.getDate() - 1);

        document.getElementById('current-date').innerText = shiftStart.toLocaleDateString('uk-UA');
        document.getElementById('names-box').innerHTML = names.map(n => `<span>${n}</span>`).join('');
        document.getElementById('groupSelect').value = currentShiftNum;
        tbody.innerHTML = '';

        let processedCount = 0;

        schedule.forEach((row, index) => {
            const tr = tbody.insertRow();
            const [h, m] = row.t.split(':').map(Number);
            let tT = new Date(shiftStart);
            tT.setHours(h, m, 0, 0);
            if (h < 8) tT.setDate(tT.getDate() + 1);
            
            const diffMin = (now - tT) / 60000;

            if (diffMin >= 0 && diffMin < 1 && lastNotifiedIdx !== index) {
                if (Notification.permission === "granted") {
                    new Notification("ЧАС ОБХОДУ!", { body: `Виконавець: ${row.exec}` });
                }
                lastNotifiedIdx = index;
            }

            if (diffMin >= 0 && diffMin < 60) tr.className = 'current-task-row';
            else if (diffMin >= 60) tr.className = 'past-task-row';

            let checkHtml = "";
            if (row.task === 'walk') {
                if (logs[index]) {
                    checkHtml = `<b style="color:var(--success)">✓ ${logs[index]}</b>`;
                    processedCount++;
                } else if (diffMin > 60) {
                    checkHtml = `<small style="color:var(--danger)">ВТРАЧЕНО</small>`;
                    processedCount++; 
                } else if (diffMin < 0) {
                    checkHtml = `<span style="opacity:0.3">...</span>`;
                } else {
                    checkHtml = `<input type="checkbox" style="transform: scale(1.2);" onchange="mark(${index})">`;
                }
            } else {
                checkHtml = `<small>сон</small>`;
            }

            tr.innerHTML = `<td>${row.t}</td><td>${row.exec}</td><td>${row.post.join(', ')}</td><td align="center">${checkHtml}</td>`;
        });

        const totalWalks = schedule.filter(r => r.task === 'walk').length;
        const btn = document.getElementById('nextShiftBtn');
        const msg = document.getElementById('statusMessage');

        if (processedCount < totalWalks) {
            btn.disabled = true;
            msg.innerText = `Оброблено: ${processedCount}/${totalWalks}`;
            msg.style.color = "var(--danger)";
        } else if (now.getHours() < 8 && now.getHours() >= 0) {
            btn.disabled = true;
            msg.innerText = "Здача можлива після 08:00";
            msg.style.color = "#e67e22";
        } else {
            btn.disabled = false;
            msg.innerText = "Готово до зміни!";
            msg.style.color = "var(--success)";
        }
    }

    function mark(id) { 
        logs[id] = new Date().toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'}); 
        localStorage.setItem('duty_logs', JSON.stringify(logs)); 
        render(); 
    }

    function changeShift(n) { 
        currentShiftNum = parseInt(n); 
        localStorage.setItem('active_shift', n); 
        render(); 
    }

    function transferShift() { 
        if(confirm("Перейти до наступної зміни?")) { 
            logs = {}; 
            localStorage.removeItem('duty_logs'); 
            currentShiftNum = currentShiftNum === 1 ? 2 : 1;
            localStorage.setItem('active_shift', currentShiftNum);
            render(); 
        } 
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA');
        if (new Date().getSeconds() === 0) render();
    }, 1000);

    render();
</script>
</body>
</html>
