<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Графік чергування (Full Cycle)</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --active-bg: #fff9db; --body-bg: #f0f2f5; --card-bg: white; --text: #2c3e50;
            --grad: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        body.dark-theme {
            --body-bg: #1a1a1a; --card-bg: #2d2d2d; --text: #ecf0f1;
            --light: #3d3d3d; --active-bg: #4d4520;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--body-bg); margin: 0; padding: 5px; color: var(--text); transition: 0.3s; overflow-x: hidden; }
        .container { max-width: 1000px; margin: auto; background: var(--card-bg); padding: 12px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid var(--light); padding-bottom: 8px; flex-wrap: nowrap; gap: 5px; }
        .header-title h1 { margin: 0; font-size: 1.4em; font-weight: 800; line-height: 1; }
        .header-title small { font-size: 0.7em; color: #7f8c8d; font-weight: bold; display: block; }
        
        .time-area { text-align: center; flex-grow: 1; min-width: 100px; }
        #clock { font-size: 1.5em; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
        #current-date { font-size: 0.75em; font-weight: bold; display: block; margin-bottom: 2px; }

        .top-right-tool { display: flex; gap: 4px; }
        .tool-btn { background: var(--light); width: 36px; height: 36px; border-radius: 8px; font-size: 16px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; color: var(--text); }
        .tool-btn.active { background: var(--warning); color: #000; }

        .top-controls { margin-bottom: 12px; }
        .group-selector { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--grad); color: white; font-size: 1em; font-weight: 800; text-align: center; appearance: none; margin-bottom: 6px; }
        .personnel-display { background: var(--light); border-radius: 8px; padding: 6px; display: flex; justify-content: space-around; font-weight: bold; font-size: 0.8em; flex-wrap: wrap; gap: 4px; }

        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 290px; table-layout: fixed; }
        th { background: var(--light); padding: 6px 4px; text-align: left; border-bottom: 2px solid var(--accent); font-size: 0.7em; text-transform: uppercase; }
        td { padding: 8px 4px; border-bottom: 1px solid var(--light); vertical-align: middle; font-size: 0.8em; word-wrap: break-word; }

        .current-task-row { animation: pulse 2s infinite; border-left: 4px solid var(--warning) !important; background-color: var(--active-bg); }
        body.dim-past .past-task-row { opacity: 0.45; filter: grayscale(40%); }

        .footer { margin-top: 15px; text-align: center; }
        .btn { padding: 14px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 0.9em; transition: 0.2s; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:disabled { background: #ccc !important; opacity: 0.6; cursor: not-allowed; }
        .status-msg { font-size: 0.75em; margin-bottom: 6px; font-weight: bold; }

        @keyframes pulse { 0% { background-color: var(--active-bg); } 50% { filter: brightness(1.1); } 100% { background-color: var(--active-bg); } }
    </style>
</head>
<body class="dim-past">

<div class="container">
    <div class="header">
        <div class="header-title"><h1>Графік</h1><small>чергувань</small></div>
        <div class="time-area">
            <span id="current-date">--.--.----</span>
            <div id="clock">00:00:00</div>
        </div>
        <div class="top-right-tool">
            <button class="tool-btn" onclick="toggleTheme()">🌓</button>
            <button class="tool-btn active" id="lightBtn" onclick="toggleDimming()">💡</button>
        </div>
    </div>

    <div class="top-controls">
        <select id="groupSelect" class="group-selector" onchange="changeShift(this.value)">
            <option value="1">Зміна №1</option>
            <option value="2">Зміна №2</option>
        </select>
        <div class="personnel-display" id="names-box"></div>
    </div>

    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
                <tr>
                    <th style="width: 18%;">План</th>
                    <th style="width: 32%;">Завдання / Хто</th>
                    <th style="width: 32%;">На посту</th>
                    <th style="width: 18%; text-align:center;">Звіт</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer">
        <div id="statusMessage" class="status-msg"></div>
        <button id="nextShiftBtn" class="btn btn-success" disabled onclick="transferShift()">↻ Наступна зміна</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    let logs = JSON.parse(localStorage.getItem('duty_logs')) || {};
    let currentShiftNum = parseInt(localStorage.getItem('active_shift')) || 1;
    let lastNotifiedIdx = null;

    if(localStorage.getItem('dark_theme') === 'true') document.body.classList.add('dark-theme');
    if (Notification.permission !== 'granted') Notification.requestPermission();

    function playSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523.25, 659.25].forEach((freq, i) => {
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.1, ctx.currentTime + i*0.2);
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.2 + 0.15);
                o.start(ctx.currentTime + i*0.2); o.stop(ctx.currentTime + i*0.2 + 0.15);
            });
        } catch(e) {}
    }

    const scheduleData = (names) => [
        {t: "08:00", task: "walk", label: "Зміна чергових", exec: "Всі", post: [names[0], names[1], names[2]]},
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]},
        {t: "06:20", task: "walk", label: "Підготовка", exec: "До зміни", post: [names[0], names[1]]}
    ];

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-theme');
        localStorage.setItem('dark_theme', isDark);
    }

    function toggleDimming() {
        document.body.classList.toggle('dim-past');
        document.getElementById('lightBtn').classList.toggle('active');
    }

    function render() {
        const now = new Date();
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const schedule = scheduleData(names);

        let shiftStart = new Date(now);
        if (now.getHours() < 8) shiftStart.setDate(shiftStart.getDate() - 1);
        shiftStart.setHours(8, 0, 0, 0);

        document.getElementById('current-date').innerText = shiftStart.toLocaleDateString('uk-UA');
        document.getElementById('names-box').innerHTML = names.map(n => `<span>${n}</span>`).join('');
        document.getElementById('groupSelect').value = currentShiftNum;
        tbody.innerHTML = '';

        let processedCount = 0;

        schedule.forEach((row, index) => {
            const tr = tbody.insertRow();
            const [h, m] = row.t.split(':').map(Number);
            
            let taskTime = new Date(shiftStart);
            taskTime.setHours(h, m, 0, 0);
            if (h < 8) taskTime.setDate(taskTime.getDate() + 1);
            
            const diffMin = (now - taskTime) / 60000;

            if (diffMin >= 0 && diffMin < 1 && lastNotifiedIdx !== index) {
                playSound();
                if (Notification.permission === "granted") {
                    new Notification("УВАГА", { body: `${row.label || 'Обхід'} - ${row.exec}` });
                }
                lastNotifiedIdx = index;
            }

            if (diffMin >= 0 && diffMin < (index === 22 ? 100 : 60)) tr.className = 'current-task-row';
            else if (diffMin >= (index === 22 ? 100 : 60)) tr.className = 'past-task-row';

            let checkHtml = "";
            if (row.task === 'walk') {
                if (logs[index]) {
                    checkHtml = `<b style="color:var(--success)">✓ ${logs[index]}</b>`;
                    processedCount++;
                } else if (diffMin > (index === 22 ? 100 : 60)) {
                    checkHtml = `<small style="color:var(--danger);font-weight:bold">ВТРАЧЕНО</small>`;
                    processedCount++; 
                } else if (diffMin < 0) {
                    checkHtml = `<span style="opacity:0.3">...</span>`;
                } else {
                    checkHtml = `<input type="checkbox" style="width:18px;height:18px" onchange="mark(${index})">`;
                }
            } else {
                checkHtml = `<small style="opacity:0.5">сон</small>`;
            }

            const displayName = row.label ? `<b>${row.label}</b>` : row.exec;
            tr.innerHTML = `<td><b>${row.t}</b></td><td>${displayName}</td><td>${row.post.join(', ')}</td><td align="center">${checkHtml}</td>`;
        });

        updateNextShiftButton(schedule, processedCount, now);
    }

    function updateNextShiftButton(schedule, processed, now) {
        const total = schedule.filter(r => r.task === 'walk').length;
        const btn = document.getElementById('nextShiftBtn');
        const msg = document.getElementById('statusMessage');
        const isTimeForNext = now.getHours() >= 8;

        if (processed < total) {
            btn.disabled = true;
            msg.innerText = `Заповнення: ${processed}/${total}`;
            msg.style.color = "var(--danger)";
        } else if (!isTimeForNext) {
            btn.disabled = true;
            msg.innerText = "Здача о 08:00";
            msg.style.color = "#e67e22";
        } else {
            btn.disabled = false;
            msg.innerText = "Можна здавати зміну";
            msg.style.color = "var(--success)";
        }
    }

    function mark(id) { 
        logs[id] = new Date().toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'}); 
        localStorage.setItem('duty_logs', JSON.stringify(logs)); 
        render(); 
    }

    function changeShift(n) { 
        currentShiftNum = parseInt(n); 
        localStorage.setItem('active_shift', n); 
        render(); 
    }

    function transferShift() { 
        if(confirm("Перейти до наступної зміни?")) { 
            logs = {}; 
            localStorage.removeItem('duty_logs'); 
            currentShiftNum = (currentShiftNum === 1) ? 2 : 1;
            localStorage.setItem('active_shift', currentShiftNum);
            render(); 
        } 
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA');
        if (new Date().getSeconds() === 0) render();
    }, 1000);

    render();
</script>
</body>
</html>
