<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік чергування з архівом</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --active-bg: #fff9db;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: var(--primary); transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 2px solid var(--light); padding-bottom: 10px; }
        .date-area { font-size: 1.1em; font-weight: bold; color: var(--dark); }
        #clock { font-size: 1.8em; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

        .top-controls { display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px; margin-bottom: 20px; align-items: center; }
        .group-selector {
            width: 100%; padding: 15px; border: 2px solid var(--accent); border-radius: 10px;
            background: var(--accent); color: white; font-size: 1.2em; font-weight: 800;
            cursor: pointer; text-align: center; text-transform: uppercase;
        }

        .personnel-display { 
            background: #f8f9fa; border: 1px solid #ddd; border-radius: 10px; padding: 12px;
            display: flex; justify-content: space-around; font-weight: bold; font-size: 1.1em;
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; font-size: 0.9em; color: #666; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; }

        .current-task-row { background-color: var(--active-bg) !important; border-left: 10px solid var(--warning) !important; font-weight: bold; }
        body.dim-past .past-task-row { opacity: 0.35; filter: grayscale(80%); }

        /* Модальне вікно історії */
        #historyModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content { background: white; width: 90%; max-width: 700px; padding: 25px; border-radius: 15px; max-height: 80vh; overflow-y: auto; }
        .history-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.9em; }

        /* Кнопки */
        .footer { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
        .btn { padding: 12px 25px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-success { background: var(--success); color: white; flex-grow: 1; }
        .btn-info { background: var(--dark); color: white; }
        .light-toggle { background: #eee; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; border: none; }
        .light-toggle.active { background: var(--warning); box-shadow: 0 0 10px var(--warning); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body class="dim-past">

<div class="container">
    <div class="header">
        <div class="date-area">
            <div>Графік чергування</div>
            <div id="current-date">--.--.----</div>
        </div>
        <div id="clock">00:00:00</div>
    </div>

    <div class="top-controls">
        <select id="groupSelect" class="group-selector" onchange="changeShift(this.value)">
            <option value="1">Зміна №1</option>
            <option value="2">Зміна №2</option>
        </select>
        <div class="personnel-display" id="names-box"></div>
    </div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>План</th>
                <th>Виконавець</th>
                <th>На посту</th>
                <th style="text-align:center;">Звіт</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="footer">
        <button class="light-toggle active" id="lightBtn" onclick="toggleDimming()">💡</button>
        <button class="btn btn-info" onclick="showHistory()">📜 Історія</button>
        <button id="nextShiftBtn" class="btn btn-success" disabled onclick="transferShift()">Здати чергування</button>
    </div>
</div>

<div id="historyModal">
    <div class="modal-content">
        <h3>📜 Архів попередніх змін</h3>
        <button class="btn btn-info" onclick="downloadHistory()" style="margin-bottom:15px; width:100%">⬇ Скачати .txt базу</button>
        <div id="historyList"></div>
        <button class="btn" style="background:#eee; width:100%; margin-top:15px;" onclick="closeHistory()">Закрити</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    
    let logs = JSON.parse(localStorage.getItem('duty_logs')) || {};
    let shiftHistory = JSON.parse(localStorage.getItem('shift_history')) || [];
    let currentShiftNum = parseInt(localStorage.getItem('active_shift')) || 1;

    const scheduleData = (names) => [
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]}
    ];

    function toggleDimming() {
        document.body.classList.toggle('dim-past');
        document.getElementById('lightBtn').classList.toggle('active');
    }

    function changeShift(num) {
        currentShiftNum = parseInt(num);
        localStorage.setItem('active_shift', currentShiftNum);
        render();
    }

    function render() {
        const now = new Date();
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const schedule = scheduleData(names);
        
        document.getElementById('current-date').innerText = now.toLocaleDateString('uk-UA');
        document.getElementById('names-box').innerHTML = names.map(n => `<span>${n}</span>`).join('');
        document.getElementById('groupSelect').value = currentShiftNum;

        tbody.innerHTML = '';
        schedule.forEach((row, index) => {
            const tr = tbody.insertRow();
            const [h, m] = row.t.split(':').map(Number);
            let taskTime = new Date(); taskTime.setHours(h, m, 0, 0);
            
            if (now.getHours() < 8 && h >= 8) taskTime.setDate(taskTime.getDate() - 1);
            else if (now.getHours() >= 8 && h < 8) taskTime.setDate(taskTime.getDate() + 1);
            
            const diffMin = (now - taskTime) / 60000;
            if (diffMin >= 0 && diffMin < 60) tr.className = 'current-task-row';
            else if (diffMin >= 60) tr.className = 'past-task-row';

            let checkHtml = row.task === 'walk' ? 
                (logs[index] ? `<b style="color:var(--success)">✓ ${logs[index]}</b>` : 
                (diffMin > 60 ? `<small style="color:var(--danger)">ПРОПУЩЕНО</small>` : 
                (diffMin < 0 ? `---` : `<input type="checkbox" onchange="mark(${index})">`))) : `<small>сон</small>`;

            tr.innerHTML = `<td>${row.t}</td><td>${row.exec}</td><td>${row.post.join('<br>')}</td><td align="center">${checkHtml}</td>`;
        });
        document.getElementById('nextShiftBtn').disabled = Object.keys(logs).length < schedule.filter(r => r.task === 'walk').length;
    }

    function mark(id) {
        logs[id] = new Date().toLocaleTimeString('uk-UA').slice(0, 5);
        localStorage.setItem('duty_logs', JSON.stringify(logs));
        render();
    }

    function transferShift() {
        if(!confirm("Здати зміну та зберегти в архів?")) return;
        
        const shiftReport = {
            date: new Date().toLocaleString('uk-UA'),
            shift: currentShiftNum,
            personnel: currentShiftNum === 1 ? s1.join(', ') : s2.join(', '),
            details: logs
        };
        
        shiftHistory.unshift(shiftReport);
        localStorage.setItem('shift_history', JSON.stringify(shiftHistory));
        
        logs = {};
        localStorage.removeItem('duty_logs');
        currentShiftNum = currentShiftNum === 1 ? 2 : 1;
        localStorage.setItem('active_shift', currentShiftNum);
        render();
        alert("Зміну збережено в архів!");
    }

    function showHistory() {
        document.getElementById('historyModal').style.display = 'flex';
        const list = document.getElementById('historyList');
        list.innerHTML = shiftHistory.length ? shiftHistory.map(h => `
            <div class="history-item">
                <b>${h.date} (Зміна №${h.shift})</b><br>
                <small>Склад: ${h.personnel}</small><br>
                <span>Відмітки: ${Object.values(h.details).join(', ') || 'немає'}</span>
            </div>
        `).join('') : '<p>Архів порожній</p>';
    }

    function closeHistory() { document.getElementById('historyModal').style.display = 'none'; }

    function downloadHistory() {
        let text = "БАЗА ДАНИХ ЧЕРГУВАНЬ\n====================\n\n";
        shiftHistory.forEach(h => {
            text += `Дата: ${h.date}\nЗміна: №${h.shift}\nСклад: ${h.personnel}\nЧас обходів: ${Object.values(h.details).join(', ')}\n--------------------\n`;
        });
        const blob = new Blob([text], {type: 'text/plain'});
        const anchor = document.createElement('a');
        anchor.download = 'duty_history.txt';
        anchor.href = (window.webkitURL || window.URL).createObjectURL(blob);
        anchor.click();
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA');
        if (new Date().getSeconds() === 0) render();
    }, 1000);

    render();
</script>
</body>
</html>
