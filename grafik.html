<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оперативный график 24/7</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--light); padding-bottom: 20px; margin-bottom: 20px; }
        .status-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .status-card { background: var(--dark); color: white; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; color: var(--primary); border-bottom: 3px solid var(--light); }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        tr:hover { background: #fcfcfc; }
        .active-now { background: #fff9db !important; font-weight: bold; border-left: 5px solid var(--warning); }
        
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold; text-transform: uppercase; }
        .walk { background: #d1ecf1; color: #0c5460; }
        .sleep { background: #e2e3e5; color: #383d41; }
        
        .check-container { text-align: center; }
        .check-box { width: 25px; height: 25px; cursor: pointer; }
        .log-time { font-size: 0.75em; color: var(--success); display: block; margin-top: 4px; }

        .footer { margin-top: 30px; padding: 20px; border-top: 2px solid var(--light); text-align: center; }
        #saveBtn { 
            padding: 18px 50px; font-size: 1.2em; border: none; border-radius: 50px; 
            cursor: pointer; transition: 0.4s; font-weight: bold; 
        }
        #saveBtn:disabled { background: #ccc; color: #999; cursor: not-allowed; }
        #saveBtn:enabled { background: var(--success); color: white; box-shadow: 0 5px 15px rgba(39,174,96,0.3); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color: var(--primary);">Контроль Смены 24/7</h2>
        <div id="clock" style="font-size: 1.2em; font-weight: bold; color: var(--accent);">--:--:--</div>
    </div>

    <div class="status-panel">
        <div class="status-card" id="date-info">Дата: --.--.--</div>
        <div class="status-card" id="shift-info">Смена: --</div>
        <div class="status-card" id="progress-info">Выполнено: 0%</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Время</th>
                <th>Тип</th>
                <th>Исполнитель</th>
                <th>На посту</th>
                <th style="text-align:center;">Отметка</th>
            </tr>
        </thead>
        <tbody id="mainTable"></tbody>
    </table>

    <div class="footer">
        <button id="saveBtn" disabled onclick="generateFinalReport()">ЗАВЕРШИТЬ СМЕНУ И СКАЧАТЬ ОТЧЕТ</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов А.", "Драний О.", "Литовченко С."];
    const s2 = ["Щербатюк О.", "Ікальчик К.", "Приведенюк Р. "];
    let logs = {};

    function getShiftData() {
        const d = new Date().getDate();
        const isS1 = [1,2,3, 7,8,9, 13,14,15, 19,20,21, 25,26,27, 31].includes(d);
        return isS1 ? {id: 1, p: s1} : {id: 2, p: s2};
    }

    function build() {
        const data = getShiftData();
        const names = data.p;
        document.getElementById('shift-info').innerText = "Смена №" + data.id;
        document.getElementById('date-info').innerText = new Date().toLocaleDateString();

        const rows = [
            {t: "08:20", task: "walk", exec: names[0], post: names[1]+", "+names[2]},
            {t: "09:20", task: "walk", exec: names[1], post: names[0]+", "+names[2]},
