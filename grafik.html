<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Графік Чергування</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #ecf0f1;
            --accent: #3498db;
            --active-bg: #4d4520;
            --border: #3d3d3d;
            --warning: #f1c40f;
            --success: #27ae60;
        }

        /* Налаштування для повного екрану */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            color: var(--text);
            overflow: hidden; /* Заборона скролу всього екрану */
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 8px;
            box-sizing: border-box;
        }

        /* Шапка як на фото */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }

        .header-left h1 { margin: 0; font-size: 22px; text-transform: uppercase; }
        .header-left small { opacity: 0.6; font-size: 12px; }

        .status-monitor {
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .status-monitor span { display: block; font-size: 10px; color: #95a5a6; text-transform: uppercase; }
        .status-monitor b { font-size: 18px; color: var(--accent); font-family: monospace; }

        .header-right { text-align: right; }
        .clock { font-size: 20px; font-weight: bold; color: var(--text); display: block; }
        .tool-btn {
            margin-top: 5px; width: 35px; height: 35px; border-radius: 6px; border: none;
            background: var(--border); color: white; cursor: pointer; font-size: 18px;
        }
        .tool-btn.active { background: var(--warning); color: black; }

        /* Контейнер таблиці з власною прокруткою */
        .table-scroll {
            flex: 1;
            background: var(--card);
            border-radius: 10px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        th { 
            position: sticky; top: 0; background: #222; z-index: 10;
            padding: 10px 5px; font-size: 12px; text-transform: uppercase; color: #7f8c8d;
            border-bottom: 2px solid var(--accent); text-align: left;
        }

        td { 
            padding: 12px 5px; border-bottom: 1px solid var(--border); 
            font-size: 15px; vertical-align: top; word-wrap: break-word;
        }

        /* Колонки */
        .col-plan { width: 22%; font-weight: bold; color: var(--accent); }
        .col-task { width: 30%; }
        .col-post { width: 38%; }
        .col-zvit { width: 10%; text-align: center; }

        /* Прозорість та активний рядок */
        .past-task-row { opacity: 0.4; filter: grayscale(100%); }
        body.light-on .past-task-row { opacity: 1 !important; filter: none !important; }

        .active-row { background: var(--active-bg); border-left: 4px solid var(--warning); font-weight: bold; }

        /* Прізвища без ком */
        .name-item { display: block; margin-bottom: 2px; }

        /* Нижня кнопка */
        .footer { padding-top: 8px; }
        .next-btn {
            width: 100%; height: 55px; border-radius: 12px; border: none;
            background: var(--accent); color: white; font-size: 18px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .next-btn:disabled { background: #444; color: #888; }
    </style>
</head>
<body class="light-on"> <div class="main-container">
    <div class="header">
        <div class="header-left">
            <h1>ГРАФІК</h1>
            <small id="date-display">09.03.2026</small>
        </div>
        <div class="status-monitor">
            <span>Обхід через</span>
            <b id="timer-display">00:17:21</b>
        </div>
        <div class="header-right">
            <span class="clock" id="clock-display">08:02:37</span>
            <button class="tool-btn active" id="light-btn" onclick="toggleLight()">💡</button>
        </div>
    </div>

    <div class="table-scroll">
        <table>
            <thead>
                <tr>
                    <th class="col-plan">План</th>
                    <th class="col-task">Завдання</th>
                    <th class="col-post">Пост</th>
                    <th class="col-zvit">Звіт</th>
                </tr>
            </thead>
            <tbody id="schedule-body">
                </tbody>
        </table>
    </div>

    <div class="footer">
        <button id="shift-btn" class="next-btn" disabled>Наступна зміна</button>
    </div>
</div>

<script>
    const namesS1 = ["Кузнєцов", "Драний", "Литовченко"];
    let logs = JSON.parse(localStorage.getItem('duty_logs_v3')) || {};

    const dataModel = [
        {t: "08:00-08:20", h: 8, m: 0, dur: 20, task: "Зміна чергових", post: [0, 1, 2]},
        {t: "08:20", h: 8, m: 20, dur: 60, task: 0, post: [1, 2]},
        {t: "09:20", h: 9, m: 20, dur: 60, task: 1, post: [0, 2]},
        {t: "10:20", h: 10, m: 20, dur: 60, task: 2, post: [0, 1]},
        {t: "11:20", h: 11, m: 20, dur: 60, task: 0, post: [1, 2]},
        {t: "12:20", h: 12, m: 20, dur: 60, task: 1, post: [0, 2]},
        {t: "13:20", h: 13, m: 20, dur: 60, task: 2, post: [0, 1]},
        {t: "14:20", h: 14, m: 20, dur: 60, task: 0, post: [1, 2]},
        {t: "15:20", h: 15, m: 20, dur: 60, task: 1, post: [0, 2]}
    ];

    function toggleLight() {
        document.body.classList.toggle('light-on');
        document.getElementById('light-btn').classList.toggle('active');
    }

    function formatCountdown(ms) {
        const s = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function render() {
        const now = new Date();
        document.getElementById('clock-display').innerText = now.toLocaleTimeString('uk-UA');
        
        let shiftStart = new Date(now);
        if (now.getHours() < 8) shiftStart.setDate(shiftStart.getDate() - 1);
        shiftStart.setHours(8, 0, 0, 0);

        const tbody = document.getElementById('schedule-body');
        tbody.innerHTML = '';
        let nextWalk = null;

        dataModel.forEach((row, idx) => {
            const tr = document.createElement('tr');
            const tStart = new Date(shiftStart);
            tStart.setHours(row.h, row.m, 0, 0);
            const tEnd = new Date(tStart.getTime() + row.dur * 60000);

            if (now >= tEnd) tr.className = 'past-task-row';
            if (now >= tStart && now < tEnd) tr.className = 'active-row';
            if (tStart > now && !nextWalk) nextWalk = tStart;

            const taskName = typeof row.task === 'number' ? namesS1[row.task] : row.task;
            const postList = row.post.map(pIdx => `<span class="name-item">${namesS1[pIdx]}</span>`).join('');

            tr.innerHTML = `
                <td class="col-plan">${row.t}</td>
                <td class="col-task">${taskName}</td>
                <td class="col-post">${postList}</td>
                <td class="col-zvit"><input type="checkbox" ${logs[idx]?'checked':''} onchange="saveLog(${idx})"></td>
            `;
            tbody.appendChild(tr);
        });

        if (nextWalk) {
            document.getElementById('timer-display').innerText = formatCountdown(nextWalk - now);
        }

        // Кнопка перезмінки
        const btn = document.getElementById('shift-btn');
        const endShift = new Date(shiftStart); endShift.setDate(endShift.getDate()+1); endShift.setHours(8,0,0,0);
        if (now >= endShift) {
            btn.disabled = false; btn.innerText = "Здати зміну";
        } else {
            btn.disabled = true; btn.innerText = "До перезмінки: " + formatCountdown(endShift - now);
        }
    }

    function saveLog(id) {
        logs[id] = !logs[id];
        localStorage.setItem('duty_logs_v3', JSON.stringify(logs));
        render();
    }

    setInterval(render, 1000);
    render();
</script>
</body>
</html>
