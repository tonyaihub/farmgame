<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система «Часовой» — Финальный релиз</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f39c12; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --grad: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: var(--primary); }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--light); padding-bottom: 20px; margin-bottom: 20px; }
        
        /* Выпадающее меню выбора группы */
        .selector-panel { display: flex; justify-content: center; margin-bottom: 25px; }
        .group-select-wrapper { position: relative; width: 250px; }
        #groupSelect { 
            width: 100%; padding: 12px 20px; font-size: 1.1em; font-weight: bold; 
            border: 2px solid var(--primary); border-radius: 10px; cursor: pointer;
            background: white; color: var(--primary); outline: none; transition: 0.3s;
            appearance: none; -webkit-appearance: none;
        }
        #groupSelect:hover { background: #f8f9fa; border-color: var(--accent); }
        .group-select-wrapper::after {
            content: "▼"; position: absolute; right: 15px; top: 15px; pointer-events: none; font-size: 0.8em;
        }

        #alert-container { margin-bottom: 20px; }
        .alert-box { color: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: center; animation: pulse 2s infinite; }
        .alert-box.red { background: var(--danger); }
        .alert-box.orange { background: var(--warning); }
        .alert-box.blue { background: var(--accent); animation: none; }
        .alert-text { font-size: 1.2em; font-weight: bold; display: block; margin-bottom: 8px; }
        .close-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .status-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .status-card { background: var(--dark); color: white; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 0.9em; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 3px solid var(--light); font-size: 0.85em; text-transform: uppercase; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .name-list { display: block; line-height: 1.3; font-size: 0.95em; }
        .active-row { background: #fff9db !important; }
        .active-executor { background: var(--warning) !important; color: white !important; font-weight: bold; border-radius: 4px; padding: 4px 8px; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7em; font-weight: bold; text-transform: uppercase; }
        .walk { background: #d1ecf1; color: #0c5460; }
        .sleep { background: #e2e3e5; color: #383d41; }
        
        .log-time { font-size: 0.8em; color: var(--success); font-weight: bold; }
        .expired-text { color: var(--danger); font-weight: bold; font-size: 0.75em; text-transform: uppercase; border: 1px solid var(--danger); padding: 2px 4px; border-radius: 3px; }

        .footer { margin-top: 30px; padding: 30px; border-top: 2px solid var(--light); text-align: center; }
        #nextShiftBtn { padding: 20px 45px; font-size: 1.1em; font-weight: 800; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        #nextShiftBtn:disabled { background: #eee; color: #aaa; cursor: not-allowed; }
        #nextShiftBtn:enabled { background: var(--grad); color: white; box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3); animation: readyPulse 2s infinite; }

        @keyframes readyPulse { 0% {box-shadow: 0 0 0 0 rgba(52,152,219,0.7);} 70% {box-shadow: 0 0 0 15px rgba(52,152,219,0);} 100% {box-shadow: 0 0 0 0 rgba(52,152,219,0);} }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.02);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2 style="margin:0;">Оперативный Журнал 24/7</h2>
            <small>Режим контроля и оповещений</small>
        </div>
        <div id="clock" style="font-size: 1.5em; font-weight: bold; color: var(--accent); background: #f8f9fa; padding: 5px 15px; border-radius: 8px;">--:--:--</div>
    </div>

    <div class="selector-panel">
        <div class="group-select-wrapper">
            <select id="groupSelect" onchange="setShift(this.value)">
                <option value="1">Активна: Группа 1</option>
                <option value="2">Активна: Группа 2</option>
            </select>
        </div>
    </div>

    <div class="status-panel">
        <div class="status-card" id="date-info">--.--.----</div>
        <div class="status-card" id="shift-display">Группа: --</div>
        <div class="status-card" id="progress-info">Готовность: 0%</div>
    </div>

    <div id="alert-container"></div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>План</th>
                <th>Тип</th>
                <th>ИСПОЛНИТЕЛЬ</th>
                <th>На посту</th>
                <th style="text-align:center;">Подтверждение</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="footer">
        <button id="nextShiftBtn" disabled onclick="transferShift()">↻ СЛЕДУЮЩАЯ СМЕНА</button>
    </div>
</div>

<script>
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    let currentShiftNum = [1,2,3, 7,8,9, 13,14,15, 19,20,21, 25,26,27, 31].includes(new Date().getDate()) ? 1 : 2;
    let logs = {};
    let hiddenAlerts = new Set();

    const scheduleData = (names) => [
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]}
    ];

    function setShift(num) {
        currentShiftNum = parseInt(num);
        document.getElementById('groupSelect').value = currentShiftNum;
        build();
    }

    function build() {
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const now = new Date();
        document.getElementById('shift-display').innerText = "Группа №" + currentShiftNum;
        document.getElementById('date-info').innerText = now.toLocaleDateString();
        tbody.innerHTML = '';
        const schedule = scheduleData(names);

        schedule.forEach((r, i) => {
            const tr = tbody.insertRow();
            const [sH, sM] = r.t.split(':').map(Number);
            let sDate = new Date(); sDate.setHours(sH, sM, 0, 0);
            if (now.getHours() < 8 && sH >= 8) sDate.setDate(sDate.getDate() - 1);
            else if (now.getHours() >= 8 && sH < 8) sDate.setDate(sDate.getDate() + 1);
            const diff = (now - sDate) / 60000;
            const isAct = diff >= 0 && diff <= 60;
            if (isAct) tr.className = 'active-row';

            let checkContent = '';
            if (r.task === 'walk') {
                if (logs[i]) checkContent = `<span class="log-time">✓ ${logs[i]}</span>`;
                else if (diff > 60) checkContent = '<span class="expired-text">Просрочено</span>';
                else if (diff < 0) checkContent = '<small style="color:#ccc">Ожидание</small>';
                else checkContent = `<input type="checkbox" style="width:25px;height:25px;" onchange="mark(${i})">`;
            } else {
                checkContent = '<small style="color:#aaa;">—</small>';
            }

            tr.innerHTML = `
                <td><strong>${r.t}</strong></td>
                <td><span class="badge ${r.task}">${r.task==='walk'?'Обход':'Сон'}</span></td>
                <td class="${isAct ? 'active-executor' : ''}">${r.exec}${r.task==='sleep'?'<br><small style="color:#777">(Сон)</small>':''}</td>
                <td style="color:#666">${r.post.map(n=>`<span class="name-list">${n}</span>`).join('')}</td>
                <td style="text-align:center;">${checkContent}</td>
            `;
        });
        updateStatus();
    }

    function checkAlerts() {
        const now = new Date();
        const curTimeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        const container = document.getElementById('alert-container');
        let html = '';

        if (["20:15", "06:45"].includes(curTimeStr) && !hiddenAlerts.has('grp_'+curTimeStr)) {
            html += `<div class="alert-box blue"><span class="alert-text">📱 ОТМЕТКА В ГРУППЕ!</span><button class="close-btn" onclick="closeAlert('grp_${curTimeStr}')">ЗАКРЫТЬ</button></div>`;
        }

        const names = currentShiftNum === 1 ? s1 : s2;
        const schedule = scheduleData(names);
        schedule.forEach((r, i) => {
            const [sH, sM] = r.t.split(':').map(Number);
            let sDate = new Date(); sDate.setHours(sH, sM, 0, 0);
            if (now.getHours() < 8 && sH >= 8) sDate.setDate(sDate.getDate() - 1);
            else if (now.getHours() >= 8 && sH < 8) sDate.setDate(sDate.getDate() + 1);
            const diff = (sDate - now) / 60000;
            if (r.task === 'walk' && diff > 0 && diff <= 5 && !hiddenAlerts.has('w_'+i)) {
                html += `<div class="alert-box orange"><span class="alert-text">🚶 На обход через 5 минут! (${r.t})</span><button class="close-btn" onclick="closeAlert('w_${i}')">ЗАКРЫТЬ</button></div>`;
            }
            if (r.task === 'sleep' && diff < 0 && diff > -120) {
                const nxt = schedule[i+1];
                if (nxt) {
                    const [nH, nM] = nxt.t.split(':').map(Number);
                    let nDate = new Date(); nDate.setHours(nH, nM, 0, 0);
                    if (now.getHours() < 8 && nH >= 8) nDate.setDate(nDate.getDate() - 1);
                    else if (now.getHours() >= 8 && nH < 8) nDate.setDate(nDate.getDate() + 1);
                    const diffW = (nDate - now) / 60000;
                    if (diffW > 0 && diffW <= 5 && !hiddenAlerts.has('wake_'+i)) {
                        html += `<div class="alert-box red"><span class="alert-text">⏰ Разбуди коллегу! (${nxt.exec})</span><button class="close-btn" onclick="closeAlert('wake_${i}')">ЗАКРЫТЬ</button></div>`;
                    }
                }
            }
        });
        container.innerHTML = html;
    }

    function closeAlert(id) { hiddenAlerts.add(id); checkAlerts(); }
    function mark(id) { logs[id] = new Date().toLocaleTimeString().slice(0,5); build(); }
    
    function updateStatus() {
        const schedule = scheduleData(s1);
        const walkTasks = schedule.filter(r => r.task === 'walk').length;
        const done = Object.keys(logs).length + document.querySelectorAll('.expired-text').length;
        document.getElementById('nextShiftBtn').disabled = (done < walkTasks);
        document.getElementById('progress-info').innerText = `Готовность: ${Math.round(done/walkTasks*100)}%`;
    }

    function transferShift() {
        if(confirm("Сдать смену? Журнал будет очищен.")) {
            logs = {}; hiddenAlerts.clear();
            const nextGrp = currentShiftNum === 1 ? 2 : 1;
            setShift(nextGrp);
            window.scrollTo(0,0);
        }
    }

    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        checkAlerts();
        if (new Date().getSeconds() === 0) build();
    }, 1000);

    setShift(currentShiftNum);
</script>
</body>
</html>
