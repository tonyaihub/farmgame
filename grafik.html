<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік чергування (Компактний)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #27ae60;
            --warning: #f1c40f; --light: #ecf0f1; --dark: #34495e; --danger: #e74c3c;
            --active-bg: #fff9db;
            --grad: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: var(--primary); transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }
        
        .header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--light); padding-bottom: 15px; }
        .header-title h1 { margin: 0; font-size: 2.5em; color: var(--primary); font-weight: 800; line-height: 1; }
        .header-title small { display: block; color: #7f8c8d; font-size: 1.1em; font-weight: bold; margin-top: 5px; }
        
        .time-area { text-align: center; }
        #current-date { display: block; font-size: 1.1em; color: var(--dark); font-weight: bold; }
        #clock { font-size: 2.5em; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
        
        .top-right-tool { display: flex; justify-content: flex-end; }
        .light-toggle { background: #eee; width: 45px; height: 45px; border-radius: 10px; font-size: 20px; cursor: pointer; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .light-toggle.active { background: var(--warning); border-color: #d4ac0d; }

        .top-controls { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 25px; }
        
        .group-selector {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: var(--grad); color: white; font-size: 1.3em; font-weight: 800;
            cursor: pointer; text-align: center; text-transform: uppercase; outline: none;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3); appearance: none;
        }

        /* МАКСИМАЛЬНО КОМПАКТНИЙ БЛОК ПРІЗВИЩ */
        .personnel-display { 
            background: #f8f9fa; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            padding: 4px 15px; /* Мінімальні відступи зверху/знизу */
            display: flex; 
            justify-content: space-around; 
            font-weight: bold; 
            font-size: 1.05em; 
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.03); 
            align-items: center;
            line-height: 1.2;
        }
        .personnel-display span { 
            background: rgba(52, 152, 219, 0.08); 
            padding: 1px 12px; 
            border-radius: 4px; 
            color: var(--dark); 
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px 15px; text-align: left; border-bottom: 3px solid #dee2e6; font-size: 0.9em; color: #666; text-transform: uppercase; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }

        @keyframes pulse { 0% { background-color: var(--active-bg); } 50% { background-color: #fff2b3; } 100% { background-color: var(--active-bg); } }
        .current-task-row { animation: pulse 2s infinite; border-left: 10px solid var(--warning) !important; font-weight: bold; }
        body.dim-past .past-task-row { opacity: 0.35; filter: grayscale(80%); }

        .footer { margin-top: 25px; display: flex; gap: 15px; }
        .btn { padding: 16px 30px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-success { background: var(--success); color: white; flex-grow: 1; box-shadow: 0 5px 15px rgba(39, 174, 96, 0.2); }
        .btn-info { background: var(--dark); color: white; }
    </style>
</head>
<body class="dim-past">

<div class="container">
    <div class="header">
        <div class="header-title">
            <h1>Графік</h1>
            <small>чергувань</small>
        </div>
        <div class="time-area">
            <span id="current-date">--.--.----</span>
            <div id="clock">00:00:00</div>
        </div>
        <div class="top-right-tool">
            <button class="light-toggle active" id="lightBtn" onclick="toggleDimming()" title="Затемнення минулого">💡</button>
        </div>
    </div>

    <div class="top-controls">
        <select id="groupSelect" class="group-selector" onchange="changeShift(this.value)">
            <option value="1">Активна: Зміна №1</option>
            <option value="2">Активна: Зміна №2</option>
        </select>
        <div class="personnel-display" id="names-box"></div>
    </div>

    <table id="mainTable">
        <thead>
            <tr>
                <th>План</th>
                <th>Виконавець</th>
                <th>На посту</th>
                <th style="text-align:center;">Звіт</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="footer">
        <button class="btn btn-info" onclick="showHistory()">📜 Архів</button>
        <button id="nextShiftBtn" class="btn btn-success" disabled onclick="transferShift()">↻ Здати чергування</button>
    </div>
</div>

<script>
    // Скрипти залишаються без змін, оскільки логіка працює коректно
    const s1 = ["Кузнєцов", "Драний", "Литовченко"];
    const s2 = ["Щербатюк", "Ікальчик", "Приведенюк"];
    let logs = JSON.parse(localStorage.getItem('duty_logs')) || {};
    let shiftHistory = JSON.parse(localStorage.getItem('shift_history')) || [];
    let currentShiftNum = parseInt(localStorage.getItem('active_shift')) || 1;
    let lastNotifiedTask = null;

    if (Notification.permission !== 'granted') Notification.requestPermission();

    function playSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [600, 800].forEach((freq, i) => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.1, ctx.currentTime + i*0.3);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.3 + 0.2);
            o.start(ctx.currentTime + i*0.3); o.stop(ctx.currentTime + i*0.3 + 0.2);
        });
    }

    const scheduleData = (names) => [
        {t: "08:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "09:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "10:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "11:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "12:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "13:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "14:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "15:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "16:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "17:20", task: "walk", exec: names[0], post: [names[1], names[2]]},
        {t: "18:20", task: "walk", exec: names[1], post: [names[0], names[2]]},
        {t: "19:20", task: "walk", exec: names[2], post: [names[0], names[1]]},
        {t: "20:00", task: "sleep", exec: names[0], post: [names[1], names[2]]},
        {t: "20:20", task: "walk", exec: names[1], post: [names[2]]},
        {t: "22:20", task: "walk", exec: names[2], post: [names[1]]},
        {t: "00:00", task: "sleep", exec: names[1], post: [names[0], names[2]]},
        {t: "00:20", task: "walk", exec: names[0], post: [names[2]]},
        {t: "02:20", task: "walk", exec: names[2], post: [names[0]]},
        {t: "04:00", task: "sleep", exec: names[2], post: [names[0], names[1]]},
        {t: "04:20", task: "walk", exec: names[0], post: [names[1]]},
        {t: "06:20", task: "walk", exec: names[1], post: [names[0]]}
    ];

    function render() {
        const now = new Date();
        const names = currentShiftNum === 1 ? s1 : s2;
        const tbody = document.getElementById('tableBody');
        const schedule = scheduleData(names);
        let currentIdx = -1;

        document.getElementById('current-date').innerText = now.toLocaleDateString('uk-UA');
        document.getElementById('names-box').innerHTML = names.map(n => `<span>${n}</span>`).join('');
        document.getElementById('groupSelect').value = currentShiftNum;
        tbody.innerHTML = '';

        schedule.forEach((row, index) => {
            const tr = tbody.insertRow();
            const [h, m] = row.t.split(':').map(Number);
            let tT = new Date(); tT.setHours(h, m, 0, 0);
            if (now.getHours() < 8 && h >= 8) tT.setDate(tT.getDate() - 1);
            else if (now.getHours() >= 8 && h < 8) tT.setDate(tT.getDate() + 1);
            
            const diffMin = (now - tT) / 60000;
            if (diffMin >= 0 && diffMin < 60) { 
                tr.className = 'current-task-row'; 
                currentIdx = index;
                if (lastNotifiedTask !== index) {
                    playSound();
                    if (Notification.permission === 'granted') {
                        new Notification("Час обходу!", { body: `Виконавець: ${row.exec}` });
                    }
                    lastNotifiedTask = index;
                }
            } else if (diffMin >= 60) tr.className = 'past-task-row';

            let checkHtml = row.task === 'walk' ? 
                (logs[index] ? `<b style="color:var(--success)">✓ ${logs[index]}</b>` : 
                (diffMin > 60 ? `<small style="color:var(--danger)">ПРОПУЩЕНО</small>` : 
                (diffMin < 0 ? `---` : `<input type="checkbox" onchange="mark(${index})">`))) : `<small>сон</small>`;

            tr.innerHTML = `<td>${row.t}</td><td>${row.exec}</td><td>${row.post.join('<br>')}</td><td align="center">${checkHtml}</td>`;
        });
        document.getElementById('nextShiftBtn').disabled = Object.keys(logs).length < schedule.filter(r => r.task === 'walk').length;
    }

    function mark(id) { logs[id] = new Date().toLocaleTimeString('uk-UA').slice(0, 5); localStorage.setItem('duty_logs', JSON.stringify(logs)); render(); }
    function changeShift(num) { currentShiftNum = parseInt(num); localStorage.setItem('active_shift', currentShiftNum); render(); }
    function toggleDimming() { document.body.classList.toggle('dim-past'); document.getElementById('lightBtn').classList.toggle('active'); }
    
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA');
        if (new Date().getSeconds() === 0) render();
    }, 1000);

    render();
</script>
</body>
</html>
